<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" ry="112" fill="#12151F"/>

  <!-- 불 켜진 텐트. 스위스 5박이 전부 캠핑이라 이 여행의 성격에 맞습니다.
       문을 배경색으로 뚫으면 빈 삼각형(표지판)이 되므로 등불색으로 채웁니다 —
       안에 두 사람이 있다는 뜻이 되고, 삼각형이라 32px 에서도 안 무너집니다.
       색은 도시 색 그대로 — 스위스 파랑, 등불은 바르셀로나 주황. -->

  <circle cx="256" cy="300" r="130" fill="#D4744A" fill-opacity=".10"/>
  <path d="M256 128 L400 358 L112 358 Z"
        fill="#5B94C4" stroke="#5B94C4" stroke-width="30" stroke-linejoin="round"/>
  <path d="M256 212 L316 358 L196 358 Z" fill="#D4744A"/>
  <path d="M92 384 H420" fill="none" stroke="#5A6076" stroke-width="16" stroke-linecap="round"/>
</svg>
