/* 1분마다 도는 갱신에서 실제로 바뀌는 건 시계와 "지금" 표시뿐인데
   예전엔 타임라인·이후목록·한마디·연락처를 통째로 다시 만들었습니다.
   DOM 을 버리고 새로 만들면 사용자가 길게 눌러 선택해둔 텍스트가 사라집니다.
   블록마다 의존값을 서명으로 남겨 바뀐 것만 다시 그립니다. */
const _sig = Object.create(null);
function changed(key, sig){
  if(_sig[key] === sig) return false;
  _sig[key] = sig;
  return true;
}
function resetSigs(){ for(const k in _sig) delete _sig[k]; }
let booted = false;        // 앱을 처음 연 순간인지
let foldToggled = false;   // 방금 지난 일정을 접거나 폈는지
let showFood = false;      // 먹을 곳을 펼쳐 뒀는지 (목록이 길어 평소엔 접어둡니다)
let showGift = false;      // 기념품을 펼쳐 뒀는지
let showPhrases = false;   // 한마디를 펼쳐 뒀는지 (14줄이라 평소엔 접어둡니다)
let showSOS = false;       // 긴급 연락처를 펼쳐 뒀는지 (급할 때 열면 되므로 접어둠)
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

const cityById = id => CITIES.find(c => c.id === id) || CITIES[0];

function cityColor(c){
  if(!c) return '#D4744A';
  return currentTheme() === 'light' ? (c.colorLight || c.color) : c.color;
}
function paintCityColor(){
  if(activeCity) document.documentElement.style.setProperty('--city', cityColor(activeCity));
}

/* 여행 전 / 중 / 후 */
function phase(){
  const t = today();
  if(t < TRIP.start) return 'pre';
  if(t > TRIP.end)   return 'post';
  return 'live';
}

/* -----------------------------------------------------------
   선택 가능한 일정 (day.options)
   options 가 없는 날은 이 아래 로직을 타지 않습니다 — 기존 경로 그대로.
   ----------------------------------------------------------- */
const LS_OPT = 'hm26-option:';          // 테마 저장과 같은 패턴

/* 선택이 바뀔 때마다 올라갑니다. 렌더 캐시 키에 섞어 두면
   화면을 다시 그려야 하는지 판단이 호출자의 resetSigs() 에 의존하지 않습니다. */
let optRev = 0;

function optionOf(date){
  try{ return localStorage.getItem(LS_OPT + date) || null; }catch(e){ return null; }
}
function setOption(date, id){
  try{
    if(id) localStorage.setItem(LS_OPT + date, id);
    else   localStorage.removeItem(LS_OPT + date);
  }catch(e){}
  optRev++;
}

/* 공통 일정 + 고른 옵션의 일정을 시간순으로 합칩니다.
   같은 시각이면 공통을 앞에 둡니다 (정렬을 안정적으로). */
function mergeItems(base, extra){
  if(!extra || !extra.length) return base;
  return base.map((x,i) => [x, 0, i])
    .concat(extra.map((x,i) => [x, 1, i]))
    .sort((a,b) => a[0].time < b[0].time ? -1
                 : a[0].time > b[0].time ? 1
                 : (a[1] - b[1]) || (a[2] - b[2]))
    .map(t => t[0]);
}

/* 그날 화면에 실제로 쓸 day 객체.
   옵션이 없으면 원본을 그대로 돌려주므로 기존 동작이 바뀌지 않습니다. */
function withOption(day){
  const opts = day.options;
  if(!opts || !opts.length) return day;
  const chosen = opts.find(o => o.id === optionOf(day.date)) || null;
  return Object.assign({}, day, {
    items: chosen ? mergeItems(day.items, chosen.items) : day.items,
    cash: (chosen && chosen.cash) || day.cash,
    _opts: opts,
    _chosen: chosen,
  });
}

function pickDay(){
  const t = today();
  const exact = DAYS.find(d => d.date === t);
  if(exact) return exact;
  const upcoming = DAYS.find(d => d.date > t);
  if(upcoming) return upcoming;
  return DAYS[DAYS.length - 1];
}

/* 사용자가 화살표/스와이프로 넘겨본 날. null 이면 오늘(자동) */
let viewDate = null;

function autoDay(){ return phase() === 'pre' ? DAYS[0] : pickDay(); }
function currentDay(){
  return (viewDate && DAYS.find(d => d.date === viewDate)) || autoDay();
}
function stepDay(delta){
  const i = DAYS.findIndex(d => d.date === currentDay().date);
  const next = DAYS[i + delta];
  if(!next) return;
  navDir = delta;
  viewDate = next.date;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goToday(){
  const cur = currentDay().date;
  navDir = cur > today() ? -1 : 1;
  viewDate = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
/* 특정 날로 점프할 때도 방향을 맞춰줍니다 */
/* target 을 주면 그 자리로, 아니면 맨 위로 갑니다.
   render() 가 섹션을 채우고 hidden 을 풀어준 다음에 위치를 재야 하므로
   반드시 render() 뒤에 잽니다. */
function jumpTo(date, target){
  navDir = date > currentDay().date ? 1 : -1;
  viewDate = date;
  render();
  const el = target ? $(target) : null;
  if(el && !el.hidden){
    scrolledDate = date;               // 자동 스크롤이 도로 끌어당기지 않게
    /* rAF 로는 도착하지 못합니다 — 콜백이 새 레이아웃 확정 전에 돌아
       직전 화면 기준의 옛 위치로 스크롤합니다 (이중 rAF 도 마찬가지).
       작업 경계를 한 번 넘겨야 합니다.

       거리가 멀고(수천 px) 사용자가 특정 결과를 콕 집은 상황이라 즉시 이동합니다.
       화면 안에서 살짝 옮기는 스크롤(FAB · 옵션 카드)은 smooth 그대로 둡니다. */
    setTimeout(() => el.scrollIntoView({ block: 'start', behavior: 'auto' }), 0);
    return;
  }
  if(pendingFocus) return;             // 일정 검색은 render() 가 그 줄로 데려갑니다
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 오늘 기준 상대 표현 — "내일 일정 미리보기"가 이 앱의 핵심 용도 */
function relLabel(date){
  const diff = daysBetween(today(), date);
  if(diff === 0) return '오늘';
  if(diff === 1) return '내일';
  if(diff === 2) return '모레';
  if(diff === -1) return '어제';
  return null;
}

/* -----------------------------------------------------------
   타임라인 아이템 렌더
   ----------------------------------------------------------- */
function itemHTML(it, city, cls, day, next){
  const time = `${it.time}${it.end ? ' – ' + it.end : ''}`;

  /* 시각 옆에 한국 시간.
     data.json 의 시각은 언제나 **현지 시각**이므로, 환산 기준은 폰이 어디
     있느냐가 아니라 그 날의 도시입니다. 예전엔 기기 시간대(KST_OFF)로 쟀는데
     출발 전 서울에서 보면 차이가 0이라 환산이 통째로 사라졌습니다 —
     "9/23 저녁 6시 45분" 은 보이는데 "한국은 새벽 1시 45분" 은 안 보였습니다.
     로밍이 안 잡혀 폰 시계가 안 바뀐 순간에도 같은 문제가 났습니다.
     항목의 tz 는 도시보다 우선합니다 (9/14 처럼 하루에 시계가 세 번 바뀌는 날). */
  let kst = '';
  const hasTz = it.tz != null;
  const off = hasTz ? it.tz : (city && city.tz != null ? city.tz : 540);
  const shift = 540 - off;                            // 이 시각에 더할 분
  const endShift = 540 - (it.endTz != null ? it.endTz : off);
  /* 출발지와 도착지 시계가 다른 비행편은 시작 시각이 이미 KST 라도 표시해야 합니다.
     "01:20 – 05:20" 만 보면 새벽 5시 도착으로 읽히지만 실제로는 11:20 KST 입니다. */
  if(shift || endShift){
    const a = toKst(it.time, shift);
    const b = it.end ? toKst(it.end, endShift) : null;
    const mark = a.d > 0 ? '<sup>+1</sup>' : (a.d < 0 ? '<sup>−1</sup>' : '');
    const bMark = b && b.d > 0 ? '<sup>+1</sup>' : '';
    kst = `<span class="kst">${a.t}${mark}${b ? '–' + b.t + bMark : ''} KST</span>`;
  }
  // 시각 자체가 어느 시계인지 (섞이는 날에만 붙습니다)
  const tzTag = (hasTz && it.tzl) ? `<span class="tzl">${esc(it.tzl)}</span>` : '';
  const mappable = it.map !== false && (it.place || it.name);
  const name = mappable
    ? `<a class="map-link" href="${esc(mapHref(mapQuery(it, city, day)))}" target="_blank" rel="noopener noreferrer">${esc(it.name)}${PIN}</a>`
    : esc(it.name);

  // 모임 장소 — 지도로 바로 갈 수 있어야 의미가 있음
  const m = it.meet;
  // 미팅 시각이 일정 시각과 같으면 위에 이미 떠 있으므로 생략
  const mTime = m && m.time && m.time !== it.time ? m.time : null;
  const meet = m ? `<div class="meet">
      ${mTime ? `<span class="mt">${esc(mTime)}</span>` : ''}
      <a href="${esc(mapHref(m.place || mapQuery(it, city, day)))}" target="_blank" rel="noopener noreferrer">${PIN}${esc(m.where)}</a>
    </div>` : '';

  // 다음 일정까지 어떻게 가는지 — 블록 맨 아래에 붙여 이어지게.
  // "(추정)" 은 시트에 없어서 계산해 넣은 값이라 흐리게 구분합니다.
  const mv = next && next.move
    ? `<div class="mv">${ARROW}${esc(next.move).replace(
        /\(추정\)/, '<em class="est">(추정)</em>')}</div>`
    : '';

  const refs = (it.refs || []).map(r => {
    const lb = r.label ? `<span class="lb">${esc(r.label)}</span>` : '';
    // 값 없이 안내만 (예: "메일 확인") — 복사할 게 없으므로 버튼이 아닌 표시용
    if(!r.value){
      return `<span class="ref note-only">${lb}<span>${esc(r.note || '확인 필요')}</span></span>`;
    }
    // mask:true — 화면엔 뒤 4자리만, 복사는 원본. 자릿수도 드러내지 않습니다
    const shown = r.mask
      ? `<span class="masked">${'•'.repeat(6)}${esc(String(r.value).slice(-4))}</span>`
      : `<span>${esc(r.value)}</span>`;
    const aria = r.mask
      ? `${r.label || '값'} 복사 (가려진 값)`
      : `${r.label || '값'} ${r.value} 복사`;
    return `<button type="button" class="ref" data-copy="${esc(r.value)}" aria-label="${esc(aria)}">
       ${lb}${shown}${CP}
     </button>`;
  }).join('');

  const prep = (it.prep || []).length
    ? `<div class="prep">${CK}<span class="tags">${it.prep.map(p => `<i>${esc(p)}</i>`).join('')}</span></div>`
    : '';

  // 바깥 링크 (웹캠·운행상황 등). http(s) 만 — javascript: 같은 스킴은 버립니다
  const links = (it.links || [])
    .filter(l => l && l.url && /^https?:\/\//i.test(l.url))
    .map(l => `<a class="ext" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}${EXT}</a>`)
    .join('');

  // 흐리게 처리한 지난 일정도 스크린리더가 알 수 있게
  const srState = cls === 'past' ? '<span class="sr-only">지난 일정. </span>'
                : cls === 'live' ? '<span class="sr-only">진행 중. </span>' : '';

  return `<li class="${cls}${it.star ? ' star' : ''}" data-time="${esc(it.time)}">
    ${srState}
    ${it.star ? '<span class="sr-only">하이라이트. </span>' : ''}${srLabels(it)}
    <div class="tl-t">${esc(time)}${tzTag}${kst}${bookedMark(it)}</div>
    <div class="tl-n">${it.star ? STAR : ''}${kindMark(it)}${name}${foodToggle(it, day)}</div>
    ${meet}
    ${it.desc ? `<div class="tl-d">${esc(it.desc)}</div>` : ''}
    ${prep}
    ${refs ? `<div class="refs">${refs}</div>` : ''}
    ${links ? `<div class="exts">${links}</div>` : ''}
    ${mv}
    ${foodCard(it, day)}
  </li>`;
}

/* -----------------------------------------------------------
   식사 항목의 음식 카드

   items[].food 가 true 면 그날 도시, 문자열이면 그 도시 id 의 음식을 씁니다
   (이동일에 다음 도시 것을 미리 보는 용도).
   플래그가 없는 항목은 아래 함수들이 빈 문자열을 돌려주므로
   기존 렌더 경로와 완전히 동일합니다.
   ----------------------------------------------------------- */
let foodOpen = null;   // 열려 있는 카드 키 (한 번에 하나) — 날이 바뀌면 닫힙니다
let foodIdx  = 0;      // 그 카드에서 지금 보고 있는 장

/* 카드에는 값·장소까지 적힌 것만 올립니다.
   접힌 "먹을 곳" 칩 목록은 eat 전체를 그대로 쓰므로 정보를 잃지 않습니다 —
   한 줄짜리 항목까지 카드로 넘기면 빈 카드를 여러 장 넘기게 됩니다. */
const foodMenus = pack => (pack.eat || []).filter(x => x.price);

/* 카드 한 장의 공통 모양 — {t 제목, r 오른쪽 작은 값, lines[] 아래 줄들} */
function cardPage(p){
  return `<article class="fc-item">
    <div class="fc-top">
      <span class="fc-n">${p.star ? STAR : ''}${esc(p.t)}</span>
      ${p.r ? `<span class="fc-p">${esc(p.r)}</span>` : ''}
    </div>
    ${(p.lines || []).filter(Boolean).map((l, i) =>
      `<span class="${['fc-d','fc-w','fc-t'][i] || 'fc-t'}">${esc(l)}</span>`).join('')}
  </article>`;
}

/* 칩 종류별 정의 — 붙일 조건 · 아이콘 · 카드 내용.
   items[] 에 해당 플래그가 없으면 아래를 아예 타지 않으므로
   기존 렌더 경로와 완전히 동일합니다. */
const CARDS = {
  food: {
    icon: '🍽️', label: '뭐 먹지',
    pack: (it, day) => {
      if(!it.food) return null;
      const p = FOOD[typeof it.food === 'string' ? it.food : day.city];
      return (p && foodMenus(p).length) ? p : null;
    },
    pages: p => foodMenus(p).map(x => ({
      t: x.n, r: x.price, star: x.star,
      lines: [x.d && x.d !== '—' ? x.d : '', x.where, x.note],
    })),
    note: p => p.cardNote,
  },
  gift: {
    icon: '🛍️', label: '뭐 사지',
    pack: (it, day) => {
      if(!it.gift) return null;
      const p = GIFT[typeof it.gift === 'string' ? it.gift : day.city];
      return (p && (p.buy || []).length) ? p : null;
    },
    pages: p => (p.buy || []).flatMap(g => (g.list || []).map(x => ({
      t: x.n, r: g.g, star: x.star, lines: [x.d],
    }))),
    note: p => (p.tips || [])[0],
  },
  say: {
    icon: '💬', label: '이 말 하면 돼',
    pack: (it, day) => {
      const city = cityById(day.city);
      const lang = city && city.lang;
      const p = lang && PHRASES[lang];
      return (it.say && p && (p.lines || []).length) ? p : null;
    },
    /* 현지어를 크게, 한국어·발음을 아래에. 그대로 보여주면 되니까요. */
    pages: p => (p.lines || []).map(l => ({ t: l.x, lines: [l.ko, l.r] })),
    note: p => `${p.name} · 탭하면 복사`,
  },
};

const cardKey = (kind, it, day) => `${kind}|${day.date}|${it.time}|${it.name}`;

/* 그 항목에 붙는 칩들 (없으면 빈 문자열) */
function foodToggle(it, day){
  return Object.entries(CARDS).map(([kind, C]) => {
    const pack = C.pack(it, day);
    if(!pack) return '';
    const key = cardKey(kind, it, day);
    const open = foodOpen === key;
    const n = C.pages(pack).length;
    /* 🍽(U+1F37D) 처럼 변이 선택자가 없으면 흑백으로 그려지는 이모지가 있어
       아이콘 문자열에 ️를 함께 넣어 둡니다 (CARDS.icon 참고). */
    return `<button class="food-tog" type="button" data-food="${esc(key)}"
      aria-expanded="${open}" aria-label="${open ? `${C.label} 닫기` : `${C.label} — ${n}가지 보기`}"
      ><span class="fk" aria-hidden="true">${C.icon}</span><span aria-hidden="true">${
        open ? '닫기' : `${C.label} · ${n}`}</span></button>`;
  }).join('');
}

function foodCard(it, day){
  for(const [kind, C] of Object.entries(CARDS)){
    if(foodOpen !== cardKey(kind, it, day)) continue;
    const pack = C.pack(it, day);
    if(!pack) continue;
    const pages = C.pages(pack), note = C.note(pack);
    const many = pages.length > 8;      // 점이 너무 빽빽하면 숫자로
    return `<div class="food-card fc-${kind}" role="group"
        aria-label="${esc(pack.name || '')} ${esc(C.label)}">
      <div class="fc-win"><div class="fc-track">${pages.map(cardPage).join('')}</div></div>
      <div class="fc-bar">
        ${many
          ? `<span class="fc-cnt" data-fc-cnt>1 / ${pages.length}</span>`
          : `<div class="fc-dots">${pages.map((p, i) =>
              `<button class="fc-dot${i ? '' : ' on'}" type="button" data-fc-go="${i}"
                 aria-label="${esc(p.t)}"></button>`).join('')}</div>`}
        ${note ? `<span class="fc-note">${esc(note)}</span>` : ''}
      </div>
    </div>`;
  }
  return '';
}

/* -----------------------------------------------------------
   빈 시간 칩 — 낮에 90분 이상 비는 자리에 그 도시의 갈 만한 곳을 꽂습니다.
   새 데이터 없이 food.spots · gift.spots(97곳)를 재활용합니다.
   ----------------------------------------------------------- */
const GAP_MIN = 90;                    // 이보다 짧게 잡으면 온 종일 칩이 뜹니다

function gapAfter(it, next, day){
  if(!next) return 0;
  const from = toMin(it.end || it.time), to = toMin(next.time);
  // 밤·이른 아침은 쉬는 시간이지 빈 시간이 아닙니다
  if(from < 9 * 60 || to > 21 * 60) return 0;
  const g = to - from;
  return g >= GAP_MIN ? g : 0;
}

function gapSpots(day){
  const f = FOOD[day.city], g = GIFT[day.city];
  const rows = [];
  for(const grp of (f && f.spots) || [])
    for(const x of grp.list || []) rows.push({ ...x, from: grp.g, area: grp.area });
  for(const x of (g && g.spots) || []) rows.push({ ...x, from: '기념품' });
  return rows;
}

function gapHTML(it, next, day){
  const g = gapAfter(it, next, day);
  if(!g) return '';
  const spots = gapSpots(day);
  if(!spots.length) return '';
  const key = `gap|${day.date}|${it.time}`;
  const open = foodOpen === key;
  const h = Math.floor(g / 60), m = g % 60;
  const span = `${h ? h + '시간' : ''}${m ? (h ? ' ' : '') + m + '분' : ''}`;
  return `<li class="gap-row">
    <button class="food-tog gap-tog" type="button" data-food="${esc(key)}"
      aria-expanded="${open}"
      aria-label="${open ? '닫기' : `${span} 비어 있습니다 — 근처 ${spots.length}곳 보기`}"
      ><span class="fk" aria-hidden="true">⏳</span><span aria-hidden="true">${
        open ? '닫기' : `${span} 비어요 · 근처 ${spots.length}`}</span></button>
    ${open ? gapCard(spots, day) : ''}
  </li>`;
}

function gapCard(spots, day){
  const many = spots.length > 8;
  const pages = spots.map(x => ({
    t: x.n, r: x.a || x.area, star: x.star, lines: [x.d, x.from],
  }));
  return `<div class="food-card fc-gap" role="group" aria-label="근처 갈 만한 곳">
    <div class="fc-win"><div class="fc-track">${pages.map(cardPage).join('')}</div></div>
    <div class="fc-bar">
      ${many
        ? `<span class="fc-cnt" data-fc-cnt>1 / ${pages.length}</span>`
        : `<div class="fc-dots">${pages.map((p, i) =>
            `<button class="fc-dot${i ? '' : ' on'}" type="button" data-fc-go="${i}"
               aria-label="${esc(p.t)}"></button>`).join('')}</div>`}
      <span class="fc-note">먹을 곳 · 기념품 목록에서</span>
    </div>
  </div>`;
}

/* 카드 안에서만 쓰는 상태 갱신 — 여기서 render() 를 부르면 DOM 이 새로 만들어져
   전환 애니메이션이 죽습니다. 그래서 transform 만 직접 건드립니다. */
function foodShow(card, i, animate){
  const track = card.querySelector('.fc-track');
  const n = track.children.length;
  foodIdx = Math.max(0, Math.min(n - 1, i));
  track.classList.toggle('drag', !animate);
  track.style.transform = `translateX(${-foodIdx * 100}%)`;
  if(!animate) requestAnimationFrame(() => track.classList.remove('drag'));
  card.querySelectorAll('.fc-dot').forEach((d, j) => d.classList.toggle('on', j === foodIdx));
  const cnt = card.querySelector('[data-fc-cnt]');
  if(cnt) cnt.textContent = `${foodIdx + 1} / ${n}`;
}

/* -----------------------------------------------------------
   렌더
   ----------------------------------------------------------- */
function render(){
  if(!DAYS.length) return;

  const ph   = phase();
  // 고른 옵션이 있으면 그 일정을 합친 day 로 그립니다 (옵션 없는 날은 원본 그대로)
  const day  = withOption(ph === 'pre' && !viewDate ? DAYS[0] : currentDay());
  const city = cityById(day.city);
  const now  = new Date();
  /* 기기 로컬 시간 기준입니다 — data.json 의 시각은 그날 현지 시각이므로
     현지에서는 정확하지만, 시간대를 넘는 순간에는 어긋납니다.

     9/14 비행 중 기기가 KST → CEST 로 자동 전환되면 그 순간 NOW 카드가
     7시간 점프합니다. 그래도 로직은 로컬 시간 그대로 둡니다 —
     나머지 20일은 이 방식이 정확하고, 9/14 는 이동만 있는 날이라
     실용상 문제가 없습니다. (9/14 항목에는 시각의 기준 시간대를 적어뒀습니다)
     날짜 판정(today())도 같은 기준이라 둘이 어긋나지 않습니다. */
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = day.date === today();
  const browsing = !isToday;        // 오늘이 아닌 날을 넘겨보는 중
  const rel = relLabel(day.date);
  const finished = ph === 'post' && !viewDate;   // 여행 종료 요약 화면

  /* 헤더는 항상 "지금 보고 있는 날"을 따라갑니다.
     예전엔 여행 전 화면에서만 CITIES[0](바르셀로나)을 박아뒀는데,
     9/13(결혼식·서울)이 첫날로 들어오면서 바르셀로나 랜드마크 아래에
     서울 일정이 깔리는 문제가 생겼습니다. */
  activeCity = city;
  paintCityColor();

  const headCity = activeCity;

  /* ---- 날짜 이동 버튼 ---- */
  const di = DAYS.findIndex(d => d.date === day.date);
  $('#day-prev').disabled = di <= 0;
  $('#day-next').disabled = di >= DAYS.length - 1;
  $('#today-pill').hidden = !(browsing && ph === 'live');

  /* 날이 실제로 바뀐 렌더에서만 전환 애니메이션을 재생합니다.
     1분마다 도는 자동 갱신에서 매번 재생되면 성가십니다. */
  KST_OFF = kstOffsetMin();
  const dayChanged = renderedDate !== null && renderedDate !== day.date;
  const firstPaint = renderedDate === null;
  renderedDate = day.date;

  /* ---- 헤더 ---- */
  $('#clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const tzEl = $('#tz');
  tzEl.textContent = tzAbbr();
  tzEl.title = tzName();
  if(changed('landmark', headCity.icon)) $('#landmark').innerHTML = ICONS[headCity.icon] || '';

  // 랜드마크·도시명을 넘긴 방향으로 들여보냅니다
  const lm = $('#landmark'), cn = $('#city-name');
  [lm, cn].forEach(el => el.classList.remove('in-fwd', 'in-back'));
  if(dayChanged){
    const dir = navDir < 0 ? 'in-back' : 'in-fwd';
    void lm.offsetWidth;                       // 애니메이션 재시작
    lm.classList.add(dir); cn.classList.add(dir);
    foodOpen = null; foodIdx = 0;              // 음식 카드는 날을 넘기면 닫습니다
  }
  // 앱을 처음 연 순간에만 헤더가 한 번 올라옵니다
  const hero = document.querySelector('.hero');
  if(firstPaint && !booted){
    booted = true;
    hero.classList.add('boot');
    setTimeout(() => hero.classList.remove('boot'), 900);
  }
  // 스위스처럼 한 노드 안에서 거점이 바뀌는 날은 day.label 로 실제 지명을 보여줍니다
  $('#city-name').textContent = day.label || headCity.name;
  $('#ey-flag').textContent = headCity.flag;

  const dLeft = daysBetween(today(), TRIP.start);

  if(finished){
    $('#ey-date').textContent = '여행 완료';
    $('#day-count').textContent = `${TOTAL_DAYS}일 완주`;
    $('#left').textContent = TRIP.end.replace(/-/g, '.');
  }else if(ph === 'pre' && !viewDate){
    $('#ey-date').textContent = `${fmtDate(TRIP.start)} 출발`;
    $('#day-count').textContent = dLeft === 0 ? '오늘 출발' : `D-${dLeft}`;
    $('#left').textContent = `${TOTAL_DAYS}일간의 여정`;
  }else if(browsing){
    $('#ey-date').textContent = (rel ? rel + ' · ' : '') + fmtDate(day.date);
    $('#day-count').textContent = `여행 ${day.dayNo}일차`;
    $('#left').textContent = (day._opts && !day._chosen)
      ? `${day.items.length}개 + 선택`
      : `${day.items.length}개 일정`;
  }else if(ph === 'post'){
    $('#ey-date').textContent = fmtDate(TRIP.end);
    $('#day-count').textContent = `여행 ${TOTAL_DAYS}일 완주`;
    $('#left').textContent = '집으로';
  }else{
    $('#ey-date').textContent = fmtDate(day.date);
    $('#day-count').textContent = `여행 ${day.dayNo}일차`;
    const leftDays = Math.max(0, daysBetween(today(), TRIP.end));
    $('#left').textContent = leftDays > 0 ? `${leftDays}일 남음` : '마지막 날';
  }

  /* ---- 여정 라인 ----
     왕복이라 서울에서 출발해 서울로 돌아옵니다. CITIES 는 마지막에만 서울이 있어서
     출발지 서울 노드를 앞에 하나 더 붙여 그립니다 (데이터는 그대로 7개).
     day.origin = 아직 한국인 날(9/13 결혼식) → 맨 앞 서울이 "여기". */
  const atOrigin = !!day.origin;
  const NODES = [CITIES.find(c => c.home) || CITIES[0], ...CITIES];   // 서울 + 7
  const cityIdx = CITIES.findIndex(c => c.id === city.id);
  const hereIdx = finished ? NODES.length
    : atOrigin ? 0
    : (ph === 'pre' && !viewDate) ? -1
    : cityIdx + 1;

  const track = $('#j-track');
  if(changed('track', hereIdx + '|' + NODES.length)){
    track.innerHTML = '';
    NODES.forEach((c,i) => {
      if(i > 0){
        const seg = document.createElement('div');
        seg.className = 'j-seg ' + (i <= hereIdx ? 'done' : 'pending');
        track.appendChild(seg);
      }
      /* 도시 노드를 눌러 그 도시로 이동. 서울은 양 끝에 두 번 나오므로
         맨 뒤 노드는 **마지막** 서울 날(귀국일)로 보내야 합니다 —
         첫날로 보내면 도착지를 눌렀는데 출발지가 열립니다. */
      const last = i === NODES.length - 1;
      const mine = DAYS.filter(d => d.city === c.id);
      const to = (last ? mine[mine.length - 1] : mine[0]) || DAYS[0];
      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'j-node ' + (i < hereIdx ? 'done' : i === hereIdx ? 'here' : '');
      node.dataset.date = to.date;
      node.setAttribute('aria-label',
        i === 0 ? '출발 · 여행 첫날로 이동'
        : last && mine.length > 1 ? '도착 · 귀국일로 이동'
        : `${c.name}로 이동`);
      node.title = (i === 0 ? '출발 — ' : last && mine.length > 1 ? '도착 — ' : '')
        + fmtDate(to.date);
      node.innerHTML = `<span class="j-dot"></span><span class="j-label">${esc(c.short)}</span>`;
      track.appendChild(node);
    });
  }
  /* 위 여정 라인이 이미 전체 경로를 보여주므로, 이 줄은 "직전에 있던 곳 → 지금 →
     다음 목적지"로 현재 위치를 알려주는 데 씁니다. 양옆이 늘 Seoul 이면 매일
     같은 문장이라 알려주는 게 없습니다. */
  const preHead = (ph === 'pre' && !viewDate) || atOrigin;
  const curIdx  = preHead ? 0 : Math.max(0, CITIES.findIndex(c => c.id === city.id));
  // 나라 + 도시. 스위스처럼 도시명 자리에 나라 이름이 들어간 곳은 한 번만 씁니다
  const where = c => !c ? '' :
    (c.country && c.country !== c.name
      ? `<span class="ctry">${esc(c.country)}</span> ${esc(c.name)}`
      : esc(c.name));
  const home = CITIES.find(x => x.home);
  const prevC = curIdx > 0 ? CITIES[curIdx - 1] : home;
  const nextC = curIdx < CITIES.length - 1 ? CITIES[curIdx + 1] : null;
  $('#j-route').innerHTML = nextC
    ? `${where(prevC)} → <b>${where(CITIES[curIdx])}</b> → ${where(nextC)}`
    : `${where(prevC)} → <b>${where(CITIES[curIdx])}</b> · 완주`;
  // 9/13 은 아직 한국이지만 여행 1일차는 맞으므로 진행도는 dayNo 를 씁니다
  $('#j-prog').textContent = (ph === 'pre' && !viewDate) ? 0
    : (ph === 'post' && !viewDate ? TOTAL_DAYS : day.dayNo);
  $('#j-total').textContent = TOTAL_DAYS;

  /* ---- 칩 (숙소·현금이 맨 앞) ---- */
  const strip = $('#strip');
  strip.innerHTML = '';
  // 체크인한 날에만 뜨고 다음 날 사라지던 숙소를 매일 고정합니다.
  // 밤늦게 택시에서 보여줄 한 줄이라 탭하면 주소가 복사됩니다.
  // 고른 옵션 — 탭하면 다시 고를 수 있게 칩 맨 앞에
  if(!finished && day._chosen){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'chip opt-on';
    el.dataset.reopt = day.date;
    el.innerHTML = `${CHEV}<span>${esc(day._chosen.label)}</span>`;
    el.setAttribute('aria-label', `오늘 선택: ${day._chosen.label} · 다시 고르기`);
    strip.appendChild(el);
  }
  if(!finished && day.stay){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'chip stay';
    el.dataset.copy = day.stay.addr || day.stay.place || day.stay.name;
    el.innerHTML = `${BED}<span>${esc(day.stay.name)}</span>`;
    el.title = el.dataset.copy;
    el.setAttribute('aria-label', `오늘 숙소 ${day.stay.name} · 주소 복사`);
    strip.appendChild(el);
  }
  if(!finished && day.cash){
    const el = document.createElement('span');
    el.className = 'chip cash';
    el.innerHTML = `${COIN}<span class="amt">${esc(day.cash.amount)}</span>` +
                   (day.cash.note ? ` <span>· ${esc(day.cash.note)}</span>` : '');
    if(day.cash.for) el.title = day.cash.for;
    strip.appendChild(el);
  }
  (finished ? [] : (day.chips || [])).forEach(c => {
    const el = document.createElement('span');
    el.className = 'chip' + (c.warn ? ' warn' : '');
    el.textContent = c.t;
    strip.appendChild(el);
  });

  /* ---- 현재 / 다음 판별 ----
     보통은 기기 로컬 시각(nowMin)과 일정 시각을 그냥 비교하면 맞습니다.
     하지만 9/14 처럼 하루 안에 시계가 세 번 바뀌는 날은 그러면 안 됩니다 —
     비행 중 기기가 KST→CEST 로 바뀌는 순간 "지금"이 7시간 점프했습니다.
     it.tz 가 있는 날은 각 일정을 실제 시각(epoch)으로 바꿔 비교합니다. */
  let liveIdx = -1, nextIdx = -1;
  let beforeStart = false;      // 첫 일정 전인가 — 이때 "지금"이라 하면 거짓말
  if(isToday && ph === 'live'){
    const zoned = day.items.some(i => i.tz != null);
    if(zoned){
      const now = Date.now();
      const at = (t, off) => {
        const [y,mo,dd] = day.date.split('-').map(Number);
        const [h,mi] = t.split(':').map(Number);
        return Date.UTC(y, mo-1, dd, h, mi) - off * 60000;
      };
      const starts = day.items.map(i => at(i.time, i.tz != null ? i.tz : 540));
      day.items.forEach((it,i) => {
        const s = starts[i];
        const e = it.end ? at(it.end, it.endTz != null ? it.endTz : (it.tz != null ? it.tz : 540))
                         : (starts[i+1] != null ? starts[i+1] : s + 36e5);
        if(now >= s && now < e) liveIdx = i;
        if(nextIdx === -1 && s > now) nextIdx = i;
      });
      if(liveIdx === -1 && nextIdx === -1) liveIdx = day.items.length - 1;
      beforeStart = now < starts[0];
    }else{
      day.items.forEach((it,i) => {
        const s = toMin(it.time);
        const e = it.end ? toMin(it.end) : (day.items[i+1] ? toMin(day.items[i+1].time) : 1440);
        if(nowMin >= s && nowMin < e) liveIdx = i;
        if(nextIdx === -1 && s > nowMin) nextIdx = i;
      });
      if(liveIdx === -1 && nextIdx === -1) liveIdx = day.items.length - 1;
      beforeStart = nowMin < toMin(day.items[0].time);
    }
    // 시작 전에는 첫 일정이 "지금"이자 "다음"으로 겹치므로 다음은 두 번째 일정으로
    if(beforeStart && nextIdx === 0) nextIdx = day.items.length > 1 ? 1 : -1;
  }

  /* ---- 선택 가능한 일정 ----
     고르기 전에는 카드를 늘어놓고, 타임라인·NOW 카드는 공통 일정만 씁니다. */
  const opts = day._opts || null;
  const chosen = day._chosen || null;
  const needsPick = !!opts && !chosen && !finished;
  $('#opts').hidden = !needsPick;
  if(!needsPick){
    // 숨기기만 하면 지난 날의 카드가 DOM 에 남습니다
    if(changed('opts', '-')) $('#opt-grid').innerHTML = '';
  }else if(changed('opts', day.date + '|' + currentTheme() + '|' + optRev)){
    $('#opt-head').textContent = `오늘은 골라야 합니다 · ${opts.length}가지`;
    $('#opt-grid').innerHTML = opts.map(o => `
      <button class="opt${o.recommended ? ' rec' : ''}" type="button"
              data-date="${esc(day.date)}" data-opt="${esc(o.id)}">
        <span class="opt-t">${esc(o.label)}${
          o.recommended ? '<span class="opt-badge">추천</span>' : ''}</span>
        ${o.summary ? `<span class="opt-s">${esc(o.summary)}</span>` : ''}
        ${o.cash ? `<span class="opt-c">${COIN}${esc(o.cash.amount)}${
          o.cash.for ? ' · ' + esc(o.cash.for) : ''}</span>` : ''}
      </button>`).join('');
  }

  /* ---- 여행 완료 요약 ---- */
  $('#finale').hidden = !finished;
  $('#now-card').hidden = finished;
  if(finished){
    // cities 는 7개지만 서울(home)은 출발·귀국지라 "방문한 도시"에서 뺍니다 → 6
    const visited = CITIES.filter(c => !c.home).length;
    $('#fin-title').textContent = `${TOTAL_DAYS}일의 여정이 끝났습니다`;
    $('#fin-sub').textContent =
      `${fmtDate(TRIP.start)} – ${fmtDate(TRIP.end)} · ${TRIP.couple}`;
    $('#fin-days').textContent   = TOTAL_DAYS;
    $('#fin-cities').textContent = visited;
    $('#fin-items').textContent  = DAYS.reduce((n,d) => n + d.items.length, 0);
  }

  /* ---- NOW 카드 ---- */
  const card = $('#now-card');
  $('#nc-next').classList.remove('early');
  /* 남은 시간 배지는 '오늘 · 여행 중' 에서만 켭니다.
     분기 안에서만 끄면 다른 분기로 넘어갔을 때 옛 값이 남습니다. */
  { const L = $('#next-left');
    L.hidden = true; L.classList.remove('soon'); L.title = ''; delete L.dataset.at; }
  const hasFirstDay = DAYS[0].date === TRIP.start;

  if(finished){
    countdownTarget = null;
  }else if(ph === 'pre' && !viewDate){
    card.classList.add('countdown');
    countdownTarget = parseDate(TRIP.start, hasFirstDay ? DAYS[0].items[0].time : '00:00');
    $('#nc-tag-label').textContent = '출발까지';
    tickCountdown();
    $('#now-time').innerHTML = `<span class="dday">${TRIP.start.replace(/-/g,'.')}</span> · ${esc(CITIES[0].name)}에서 시작`;
    // 1일차 일정이 아직 등록되지 않았으면 "첫 일정" 이라고 말하지 않음
    $('#nc-next').hidden = !hasFirstDay;
    if(hasFirstDay){
      const first = DAYS[0].items[0];
      $('#next-time').textContent = first.time;
      $('#next-name').textContent = `첫 일정 · ${first.name}`;
    }
  }else if(browsing){
    /* 다른 날을 미리 볼 때 — 몇 시에 시작해서 몇 시에 끝나는지, 미팅은 언제인지 */
    card.classList.remove('countdown');
    countdownTarget = null;

    const first = day.items[0];
    const last  = day.items[day.items.length - 1];
    const meetItem = day.items.find(i => i.meet);

    $('#nc-tag-label').textContent = rel || fmtDate(day.date);
    $('#now-title').textContent = `${first.time} ${first.name}`;
    /* 안 고른 선택 일정이 있는 날은 공통만 세면 "4개" 처럼 실제보다 훨씬 적게 보입니다 */
    $('#now-time').textContent = (day._opts && !day._chosen)
      ? `공통 ${day.items.length}개 + ${day._opts.length}가지 중 선택 · 마지막 ${last.time} ${last.name}`
      : `일정 ${day.items.length}개 · 마지막 ${last.time} ${last.name}`;

    $('#nc-next').hidden = false;
    if(meetItem){
      $('#next-time').textContent = meetItem.meet.time || meetItem.time;
      $('#next-name').textContent = `미팅 · ${meetItem.meet.where}`;
    }else if(day.cash){
      $('#next-time').textContent = '현금';
      $('#next-name').textContent = day.cash.for
        ? `${day.cash.amount} · ${day.cash.for}` : day.cash.amount;
    }else{
      $('#next-time').textContent = '';
      $('#next-name').textContent = day.label || cityById(day.city).name;
    }
  }else{
    card.classList.remove('countdown');
    countdownTarget = null;
    $('#nc-tag-label').textContent =
      ph === 'post' ? '여행 종료' : (beforeStart ? '곧 시작' : '지금');

    const live = day.items[liveIdx] || day.items[0];
    $('#now-title').textContent = live.name;

    // 시각 옆에 남은 일정 — 밤에 페이스를 가늠할 수 있게
    const timeTxt = live.end ? `${live.time} – ${live.end}` : live.time;
    const restN = (isToday && ph === 'live' && liveIdx > -1)
      ? day.items.length - 1 - liveIdx : 0;
    $('#now-time').innerHTML = restN > 0
      ? `${esc(timeTxt)} <span class="rest">· 남은 일정 ${restN}개 · 마지막 ${esc(day.items[day.items.length-1].time)}</span>`
      : esc(timeTxt);

    /* 아직 안 고른 날이면 카드가 먼저 그 사실을 알립니다.
       다만 고를 시각이 아직 멀면 지금 하고 있는 일이 먼저입니다 —
       9/17 은 02:30 에 일어나 바르셀로나를 떠나는데 선택지는 11:50 부터라,
       공항으로 가는 내내 카드가 "고르세요"만 띄우고 있었습니다.
       고르라는 말은 아래 선택 카드와 타임라인 자리표시가 이미 하고 있습니다. */
    if(needsPick){
      const optAt = Math.min(...opts.flatMap(o => o.items.map(i => toMin(i.time))));
      const busy = isToday && ph === 'live' && liveIdx > -1 && optAt - nowMin > LEFT_MAX;
      $('#nc-tag-label').textContent = busy ? '지금 · 선택 필요' : '선택 필요';
      if(!busy){
        $('#now-title').textContent = `${opts.length}가지 중 하나를 고르세요`;
        $('#now-time').textContent = '고르면 아래 일정에 합쳐집니다';
      }
    }

    const nxt = day.items[nextIdx];
    $('#nc-next').hidden = false;
    const leftEl = $('#next-left');
    if(nxt){
      $('#next-time').textContent = nxt.time;
      $('#next-name').textContent = nxt.desc ? `${nxt.name} · ${nxt.desc}` : nxt.name;
      // 오늘, 여행 중일 때만 — 지난 날을 넘겨보는 중엔 의미가 없습니다
      if(isToday && ph === 'live'){
        const m = nextLeftMin(nxt, day);
        if(m !== null && m >= 0 && m <= LEFT_MAX){
          leftEl.hidden = false;
          leftEl.textContent = fmtLeft(m);
          leftEl.classList.toggle('soon', m <= LEFT_SOON);
          leftEl.dataset.at = String(Date.now() + m * 60000);
          if(nxt.meet && nxt.meet.time){
            leftEl.title = `모임 ${nxt.meet.time} 까지`;
          }
        }
      }
    }else if(ph === 'post'){
      $('#next-time').textContent = '';
      $('#next-name').textContent = '모든 일정 완료';
    }else{
      /* 오늘이 끝났으면 내일 첫 일정을 보여줍니다.
         자기 전 마지막으로 보는 화면인데 "내일 몇 시에 일어나야 하는지"가
         없으면 곤란합니다 — 9/17 은 02:30 기상, 9/27 은 06:45 투어 미팅입니다. */
      const tmr = DAYS[DAYS.findIndex(d => d.date === day.date) + 1];
      if(isToday && tmr){
        const first = tmr.items[0];
        $('#next-time').textContent = `내일 ${first.time}`;
        $('#next-name').textContent = first.desc ? `${first.name} · ${first.desc}` : first.name;
        // 이른 시각이면 눈에 띄게
        $('#nc-next').classList.toggle('early', toMin(first.time) < 7 * 60);
      }else{
        $('#next-time').textContent = '';
        $('#next-name').textContent = '오늘 일정 끝';
      }
    }
  }

  /* ---- 타임라인 ---- */
  $('#sec-today').hidden = finished;
  $('#tl').setAttribute('aria-label',
    isToday ? '오늘 일정' : `${fmtDate(day.date)} 일정`);
  $('#head-today').textContent = (ph === 'pre' && !viewDate)
    ? (hasFirstDay ? '첫날 일정' : `${fmtDate(day.date)} · 미리보기`)
    : (isToday ? '오늘' : (rel ? `${rel} 일정` : fmtDate(day.date)));
  /* 지난 일정 접기 — 9/26 밤이면 18개 중 17개가 이미 끝난 일정이라
     화면 위쪽 2천 픽셀이 죽은 정보가 됩니다. 날이 바뀌면 다시 접힙니다. */
  const foldable = isToday && ph === 'live' && liveIdx > 0;
  if(showPastFor !== day.date){ showPastFor = day.date; showPast = false; }
  const fold = $('#past-fold');
  fold.hidden = !foldable;
  if(foldable){
    fold.setAttribute('aria-expanded', String(showPast));
    fold.innerHTML = CHEV + (showPast ? '지난 일정 접기' : `지난 일정 ${liveIdx}개 보기`);
  }
  const fromIdx = (foldable && !showPast) ? liveIdx : 0;

  const tlEl = $('#tl');
  // 날·진행중항목·접힘·시간대·테마가 그대로면 다시 만들지 않습니다
  const tlSig = [day.date, liveIdx, fromIdx, KST_OFF, currentTheme(), optRev,
                 foodOpen || '-'].join('|');
  const tlRebuilt = changed('tl', tlSig);
  if(tlRebuilt){
    const rows = day.items
      .map((it,i) => [it,i])
      .filter(([,i]) => i >= fromIdx)
      .flatMap(([it,i]) => {
        const row = [it.time, itemHTML(
          it, city,
          i === liveIdx ? 'live' : (liveIdx > -1 && i < liveIdx ? 'past' : ''),
          day, day.items[i+1])];
        // 낮에 길게 비는 자리에는 "근처 갈 만한 곳" 을 꽂습니다
        const gap = gapHTML(it, day.items[i+1], day);
        return gap ? [row, [it.end || it.time, gap]] : [row];
      });

    /* 아직 안 골랐으면 그 일정이 들어갈 자리를 비워두지 않고 표시합니다 */
    if(day._opts && !day._chosen){
      const times = day._opts.flatMap(o => o.items.map(x => x.time)).sort();
      if(times.length){
        const from = times[0], to = times[times.length-1];
        const at = rows.findIndex(([t]) => t > from);
        rows.splice(at < 0 ? rows.length : at, 0, [from,
          `<li class="gap"><button class="opt-gap" type="button" data-gotoopts
             aria-label="${esc(day._opts.length)}가지 중 하나를 고르면 여기에 일정이 들어갑니다">
             <span class="g-t">${esc(from)} – ${esc(to)}</span>
             <span class="g-n">${esc(day._opts.length)}가지 중 선택 — 고르면 여기에 들어갑니다</span>
           </button></li>`]);
      }
    }
    tlEl.innerHTML = rows.map(r => r[1]).join('');
    // 타임라인을 다시 만들면 카드도 새 DOM 이라 보던 메뉴로 되돌려 놓습니다
    const card = tlEl.querySelector('.food-card');
    if(card) foodShow(card, foodIdx, false);
  }

  // 날을 넘겼거나 접기를 토글했을 때만 일정이 차례로 올라옵니다
  tlEl.classList.remove('enter');
  if(dayChanged || foldToggled){
    void tlEl.offsetWidth;
    tlEl.classList.add('enter');
  }
  foldToggled = false;

  /* 검색 결과로 넘어온 경우 — 그 일정으로 데려가고 잠깐 테두리로 표시합니다 */
  if(pendingFocus && pendingFocus.date === day.date){
    const t = pendingFocus.time;
    pendingFocus = null;
    const el = tlEl.querySelector(`li[data-time="${t}"]`);
    if(el){
      el.classList.add('found');
      // 타이밍·behavior 둘 다 jumpTo 와 같은 이유로 이렇게 둡니다 (그쪽 주석 참고)
      setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'auto' }), 0);
      scrolledDate = day.date;          // 자동 스크롤이 도로 끌어당기지 않게
      setTimeout(() => el.classList.remove('found'), 2600);
    }
  }

  /* 하루 15~29개라 오후에 열면 항상 손으로 내려야 했습니다.
     그 날에 처음 들어올 때 한 번만 "지금" 일정으로 옮겨줍니다 —
     매 렌더마다 하면 사용자가 스크롤하는 걸 앱이 도로 끌어당깁니다. */
  if(liveIdx > 0 && scrolledDate !== day.date){
    scrolledDate = day.date;
    const live = $('#tl').children[liveIdx];
    // 타이밍은 jumpTo 와 같은 이유 — rAF 는 새 레이아웃 확정 전이라 옛 위치로 갑니다
    if(live) setTimeout(() => live.scrollIntoView({ block: 'center', behavior: 'auto' }), 0);
  }

  /* ---- 한마디 — 그날 도시의 언어만 ----
     영어가 막히는 자리에서 화면을 그대로 보여주면 되게 만든 것입니다.
     탭하면 현지어 문장이 복사됩니다. */
  renderFood(finished ? null : city);
  renderGift(finished ? null : city);
  renderPhrases(finished ? null : city);
  renderSOS(finished ? null : city);
  paintNet();

  /* ---- 이후 날들 — 탭하면 그 날로 이동 ---- */
  const up = $('#upcoming');
  const rest = finished ? [] : DAYS.filter(d => d.date > day.date);
  $('#sec-upcoming').hidden = rest.length === 0;
  $('#head-upcoming').textContent = `이후 ${rest.length}일`;
  // 랜드마크 SVG 가 줄마다 들어가 무거우므로 날·테마가 그대로면 그대로 둡니다
  if(changed('up', day.date + '|' + rest.length + '|' + currentTheme() + '|' + optRev))
  up.innerHTML = rest.map(d0 => {
    const d = withOption(d0);          // 고른 옵션이 있으면 그 기준으로 요약
    const c = cityById(d.city);
    const md = d.date.slice(5).replace('-','/');
    // 그날을 대표하는 일정: 투어 미팅 → 가장 오래 잡힌 활동 → 장소가 있는 일정 순
    const longest = d.items
      .filter(i => i.end)
      .sort((a,b) => (toMin(b.end) - toMin(b.time)) - (toMin(a.end) - toMin(a.time)))[0];
    const label = d._chosen ? d._chosen.label
      : d.label
      || d.items.find(i => i.meet)?.name
      || longest?.name
      || d.items.find(i => i.place)?.name
      || d.items[0].name
      || (d._opts ? `${d._opts.length}가지 중 선택` : '');
    const r = relLabel(d.date);
    return `<button class="up-row" type="button" data-date="${d.date}">
        <span class="up-ico" style="--c:${cityColor(c)}" aria-hidden="true">${ICONS[c.icon] || ''}</span>
        <span class="up-date">${r || md}</span>
        <span class="up-city">${esc(c.name)} · ${esc(label)}</span>
        ${d.cash ? `<span class="up-cash" style="--c:${cityColor(c)}">${esc(d.cash.amount)}</span>` : ''}
        <span class="up-arrow">›</span>
      </button>`;
  }).join('');

  /* ---- 출발 전 · 만나러 가는 곳 ---- */
  const showPreview = preHead;
  $('#preview-cities').hidden = !showPreview;
  if(showPreview && changed('pc', currentTheme())){
    const row = $('#pc-row');
    row.innerHTML = CITIES.filter(c => !c.home).map(c =>
      `<button class="pc-city" type="button" data-city="${c.id}" style="--c:${cityColor(c)}"
               aria-label="${esc(c.name)} 일정 보기">
         <span class="pc-ico" aria-hidden="true">${ICONS[c.icon] || ''}</span>
         <span class="pc-name">${esc(c.name)}</span>
       </button>`).join('');
    if(firstPaint){
      void row.offsetWidth;
      row.classList.add('enter');
      setTimeout(() => row.classList.remove('enter'), 1200);
    }
  }

  /* ---- 푸터 ---- */
  $('#footer').textContent = `${TRIP.couple} · ${TRIP.start.slice(0,4)}`;
  if(DATA_SOURCE && DATA_SOURCE !== 'network'){
    const note = document.createElement('div');
    note.className = 'offline-note';
    note.textContent = DATA_SOURCE === 'cache' ? '오프라인 · 저장된 일정' : '백업 일정';
    $('#footer').appendChild(note);
  }
}

/* -----------------------------------------------------------
   긴급 연락처 — 그날 나라 것 + 어디서나 쓰는 것
   (cities[].flag 가 국가코드라 그대로 열쇠로 씁니다)

   tel: 은 네트워크가 없어도 걸리므로, 모든 게 무너져도 이 화면은 살아 있습니다.
   그래서 인라인 백업에도 넣어뒀습니다.
   ----------------------------------------------------------- */
const telHref = t => 'tel:' + String(t).replace(/[^\d+]/g, '');

function sosRow(l, hot){
  // 전화번호 형태가 아닌 값은 링크로 만들지 않습니다
  if(!/^[+\d][\d\s()+-]*$/.test(String(l.tel || ''))) return '';
  return `<a class="sos-row${hot ? ' hot' : ''}" href="${esc(telHref(l.tel))}"
      aria-label="${esc(l.label)} ${esc(l.tel)} 전화 걸기">
    ${TEL}
    <span class="sos-b">
      <span class="sos-l">${esc(l.label)}</span>
      ${l.note ? `<span class="sos-n">${esc(l.note)}</span>` : ''}
    </span>
    <span class="sos-t">${esc(l.tel)}</span>
  </a>`;
}

function renderSOS(city){
  const sec = $('#sec-sos');
  const pack = city && city.flag ? CONTACTS[city.flag] : null;
  if(!pack || !(pack.lines || []).length){ sec.hidden = true; return; }

  const common = (CONTACTS.common && CONTACTS.common.lines) || [];
  // 짧은 번호(112·144…) = 현지에서 바로 거는 것이라 강조합니다
  const html = pack.lines.map(l => sosRow(l, String(l.tel).length <= 4)).join('')
             + common.map(l => sosRow(l, false)).join('');

  sec.hidden = false;
  const head = $('#head-sos');
  head.innerHTML = `${CHEV}<span>긴급 연락처 · ${esc(pack.name || city.flag)}</span>` +
    `<span class="cnt">${pack.lines.length + common.length}</span>`;
  head.setAttribute('aria-expanded', String(showSOS));
  $('#sos-body').hidden = !showSOS;
  if(changed('sos', (city && city.flag) || '-')){
    $('#sos').innerHTML = html;
    $('#sos-note').textContent = '탭하면 바로 걸립니다 · 데이터가 없어도 통화는 됩니다';
  }
}

/* -----------------------------------------------------------
   오프라인 안내 — 일정은 캐시로 그대로 열리지만 구글맵은 못 엽니다.
   탭했다가 빈 탭만 뜨고 당황하지 않게 미리 알려줍니다.
   ----------------------------------------------------------- */
function paintNet(){
  const el = $('#netnote');
  el.hidden = navigator.onLine;
  if(!navigator.onLine){
    el.textContent = '오프라인 · 일정은 저장된 것으로 그대로 열립니다. '
      + '지도는 열리지 않으니, 장소 이름을 탭하면 검색어가 복사됩니다.';
  }
}
window.addEventListener('offline', paintNet);
window.addEventListener('online',  paintNet);

/* -----------------------------------------------------------
   한마디 — 그날 도시의 언어로 자주 쓸 문장
   (cities[].lang → phrases[lang]. 둘 중 하나라도 없으면 그냥 숨깁니다)
   ----------------------------------------------------------- */
function phraseRows(lines){
  return lines.map(l => `
    <button type="button" class="phr-row" data-copy="${esc(l.x)}"
            aria-label="${esc(l.ko)} — ${esc(l.x)} 복사">
      ${SPEAK}
      <span class="phr-b">
        <span class="phr-ko">${esc(l.ko)}</span>
        <span class="phr-x">${esc(l.x)}</span>
        ${l.r ? `<span class="phr-r">${esc(l.r)}</span>` : ''}
      </span>
    </button>`).join('');
}

function renderPhrases(city){
  const sec = $('#sec-phrases');
  const pack = city && city.lang ? PHRASES[city.lang] : null;
  const lines = (pack && pack.lines) || [];
  // 영어는 현지어가 안 통할 때 쓰는 공통 수단이라 어느 도시에서나 함께 보여줍니다
  const en = (PHRASES.en && PHRASES.en.lines) || [];
  if(!lines.length && !en.length){ sec.hidden = true; return; }

  sec.hidden = false;
  const label = lines.length ? `한마디 · ${pack.name || city.lang}` : '한마디 · 영어';
  const head = $('#head-phrases');
  head.innerHTML = `${CHEV}<span>${esc(label)}</span>` +
    `<span class="cnt">${lines.length + en.length}</span>`;
  head.setAttribute('aria-expanded', String(showPhrases));
  $('#phr-body').hidden = !showPhrases;

  // 언어가 그대로면 14줄을 다시 만들 이유가 없습니다
  if(changed('phr', (city && city.lang) || '-')){
    $('#phrases').innerHTML =
      phraseRows(lines) +
      (en.length ? `<div class="phr-sub">영어 — 어디서나</div>${phraseRows(en)}` : '');
    $('#phr-note').textContent = '탭하면 복사됩니다 · 그대로 보여주셔도 됩니다';
  }
}

/* -----------------------------------------------------------
   먹을 곳 · 기념품 — 그날 도시의 참고 목록.
   (cities[].id → food[id] / gift[id]. 없는 도시(서울)는 통째로 숨습니다)

   가게 줄은 구글맵 검색으로 보냅니다. 검색어는 "이름, 지역" 인데
   지역은 항목·그룹의 area 를 먼저 씁니다 — 스위스처럼 한 도시 안에
   라우터브룬넨·그린델발트·루가노가 섞여 있으면 도시명만으론 엉뚱한 곳이 나옵니다.
   ----------------------------------------------------------- */
function refChips(list){
  return `<div class="eat-list">${list.map(x =>
    `<span class="eat-i">${x.star ? STAR : ''}<b>${esc(x.n)}</b>${
      x.d ? ` · ${esc(x.d)}` : ''}</span>`).join('')}</div>`;
}

function refRow(x, area){
  const where = x.area || area;
  // 표시 이름이 "Casa Batlló 굿즈샵" 처럼 한국어가 섞이면 지도에서 안 잡힙니다.
  // 그럴 때만 q 에 실제로 찍히는 이름을 따로 적습니다.
  const q = `${x.q || x.n}${where ? `, ${where}` : ''}`;
  return `<a class="eat-row" href="${esc(mapHref(q))}" target="_blank" rel="noopener noreferrer"
      aria-label="${esc(x.n)} 지도에서 보기">
    ${PIN}
    <span class="eat-b">
      <span class="eat-n">${x.star ? STAR : ''}${esc(x.n)}</span>
      ${x.d ? `<span class="eat-d">${esc(x.d)}</span>` : ''}
    </span>
    ${x.a ? `<span class="eat-a">${esc(x.a)}</span>` : ''}
  </a>`;
}

function refTips(tips, label){
  return tips.length
    ? `<div class="phr-sub">${esc(label)}</div>
       <div class="eat-tips">${tips.map(t =>
         `<span class="eat-tip">${esc(t)}</span>`).join('')}</div>`
    : '';
}

/* 접힌 참고 섹션 하나를 통째로 그립니다 (먹을 곳 · 기념품이 같은 틀을 씁니다).
   opts.chips  — 칩으로 보여줄 그룹들 [{g, list}]
   opts.rows   — 지도로 보내는 그룹들 [{g, list, area}]
   opts.count  — 헤더 오른쪽 숫자로 셀 대상 ('chips' | 'rows') */
function renderRef(o){
  const sec = $(`#sec-${o.key}`), head = $(`#head-${o.key}`);
  const chips = o.chips || [], rows = o.rows || [], tips = o.tips || [];
  const n = g => g.reduce((t, x) => t + (x.list || []).length, 0);
  if(!chips.length && !rows.length){ sec.hidden = true; return; }

  sec.hidden = false;
  head.innerHTML = `${CHEV}<span>${esc(o.title)}</span>` +
    `<span class="cnt">${n(o.count === 'rows' ? rows : chips)}</span>`;
  head.setAttribute('aria-expanded', String(o.open));
  $(`#${o.key}-body`).hidden = !o.open;

  // 도시가 그대로면 백 줄 가까운 목록을 다시 만들 이유가 없습니다
  if(changed(o.key, o.sig)){
    $(`#${o.key}`).innerHTML =
      chips.map(g => (g.g ? `<div class="phr-sub">${esc(g.g)}</div>` : '')
                     + refChips(g.list || [])).join('') +
      rows.map(g => (g.g ? `<div class="phr-sub">${esc(g.g)}</div>` : '')
                    + (g.list || []).map(x => refRow(x, g.area || o.area)).join('')).join('') +
      refTips(tips, o.tipLabel || '알아두면 좋은 것');
    $(`#${o.key}-note`).textContent = o.note;
  }
}

function renderFood(city){
  const pack = city ? FOOD[city.id] : null;
  renderRef({
    key: 'food', open: showFood, sig: (city && city.id) || '-',
    title: `먹을 곳 · ${(pack && pack.name) || (city && city.name) || ''}`,
    area: city && city.map, count: 'rows',
    chips: (pack && pack.eat || []).length ? [{ g: '꼭 먹어볼 것', list: pack.eat }] : [],
    rows: (pack && pack.spots) || [],
    tips: (pack && pack.tips) || [],
    note: '탭하면 지도에서 열립니다 · 예약은 각자 확인하세요'
  });
}

function renderGift(city){
  const pack = city ? GIFT[city.id] : null;
  renderRef({
    key: 'gift', open: showGift, sig: (city && city.id) || '-',
    title: `기념품 · ${(pack && pack.name) || (city && city.name) || ''}`,
    area: city && city.map, count: 'chips',
    chips: (pack && pack.buy) || [],
    rows: (pack && pack.spots || []).length ? [{ g: '사는 곳', list: pack.spots }] : [],
    tips: (pack && pack.tips) || [],
    tipLabel: '사기 전에',
    note: '탭하면 지도에서 열립니다 · 무게는 위탁 한도와 같이 보세요'
  });
}

/* -----------------------------------------------------------
   D-day 카운트다운 (초 단위)
   ----------------------------------------------------------- */
/* -----------------------------------------------------------
   다음 일정까지 남은 시간

   NOW 카드는 다음 일정의 '시각'을 이미 보여줍니다. 여기에 '몇 분 뒤'를
   더하는 이유는 시차에 절어 있을 때 지금 시각부터 떠올려 빼는 게
   부담이기 때문입니다 (KST 를 병기하는 것과 같은 이유).

   · 투어는 항목 시각이 아니라 meet.time 으로 셉니다 — 진짜 마감이 그쪽입니다
   · 3시간 넘게 남으면 숨깁니다. "5시간 뒤" 는 정보가 아니라 잡음이고
     바로 옆에 시각이 이미 적혀 있습니다
   · 내일 첫 일정에는 붙이지 않습니다 (자기 전에 "13시간 뒤" 는 쓸모없음)
   ----------------------------------------------------------- */
const LEFT_MAX = 180;          // 분. 이보다 멀면 안 보여줍니다
const LEFT_SOON = 15;          // 분. 이보다 가까우면 강조

function nextLeftMin(it, day){
  if(!it) return null;
  /* 그 시각이 어느 시계인지 데이터가 알려주면 그대로 씁니다 (9/14 처럼
     하루에 시계가 세 번 바뀌는 날). 없으면 기기 시간대로 봅니다. */
  const hhmm = (it.meet && it.meet.time) || it.time;
  const [h, mi] = hhmm.split(':').map(Number);
  const [y, mo, dd] = day.date.split('-').map(Number);
  const at = it.tz != null
    ? Date.UTC(y, mo - 1, dd, h, mi) - it.tz * 60000
    : new Date(y, mo - 1, dd, h, mi).getTime();
  return Math.round((at - Date.now()) / 60000);
}

function fmtLeft(m){
  if(m < 1) return '곧';
  if(m < 60) return `${m}분 뒤`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}시간 ${r}분 뒤` : `${h}시간 뒤`;
}

/* 남은 시간만 갱신합니다 — 1분마다 도는 render() 로는 최대 59초 늦습니다 */
function tickLeft(){
  const el = $('#next-left');
  if(!el || el.hidden || !el.dataset.at) return;
  const m = Math.round((+el.dataset.at - Date.now()) / 60000);
  if(m < 0 || m > LEFT_MAX){ render(); return; }
  el.textContent = fmtLeft(m);
  el.classList.toggle('soon', m <= LEFT_SOON);
}

function tickCountdown(){
  if(!countdownTarget) return;
  const diff = countdownTarget - new Date();
  if(diff <= 0){ render(); return; }
  const d = Math.floor(diff / 864e5);
  const h = Math.floor(diff % 864e5 / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);
  $('#now-title').textContent = d > 0
    ? `${d}일 ${pad(h)}:${pad(m)}:${pad(s)}`
    : `${pad(h)}:${pad(m)}:${pad(s)}`;
}

/* -----------------------------------------------------------
   이벤트 위임 — 예약번호 복사 / 이후 날 펼치기
   ----------------------------------------------------------- */
document.addEventListener('click', async (e) => {
  /* 오프라인이면 구글맵이 안 열립니다 — 빈 탭 대신 검색어를 복사해 줍니다.
     preventDefault 는 첫 await 전에 해야 먹히므로 맨 위에 둡니다. */
  const ml = e.target.closest('.map-link, .meet a');
  if(ml && !navigator.onLine){
    e.preventDefault();
    const q = decodeURIComponent(ml.getAttribute('href').split('query=')[1] || '');
    if(q && await copyText(q)) toast(`오프라인 · 복사됨 · ${q}`);
    else toast('오프라인 · 지도를 열 수 없습니다');
    return;
  }

  const ref = e.target.closest('.ref');
  if(ref && ref.dataset.copy){
    const val = ref.dataset.copy;
    const ok = await copyText(val);
    if(ok){
      ref.classList.add('copied');
      setTimeout(() => ref.classList.remove('copied'), 1400);
      // 가려진 값은 토스트에도 노출하지 않습니다
      toast(ref.querySelector('.masked') ? '복사됨' : `복사됨 · ${val}`);
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  const stay = e.target.closest('.chip.stay');
  if(stay && stay.dataset.copy){
    const ok = await copyText(stay.dataset.copy);
    if(ok){
      stay.classList.add('copied');
      setTimeout(() => stay.classList.remove('copied'), 1400);
      toast(`복사됨 · ${stay.dataset.copy}`);
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  const phr = e.target.closest('.phr-row');
  if(phr && phr.dataset.copy){
    const ok = await copyText(phr.dataset.copy);
    if(ok){
      phr.classList.add('copied');
      setTimeout(() => phr.classList.remove('copied'), 1400);
      toast('복사됨');
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  // 선택 가능한 일정 — 고르기 / 다시 고르기
  const optBtn = e.target.closest('.opt');
  if(optBtn){
    setOption(optBtn.dataset.date, optBtn.dataset.opt);
    resetSigs();
    render();
    return;
  }
  // 음식 카드 열기·닫기 (한 번에 하나만)
  const ftog = e.target.closest('[data-food]');
  if(ftog){
    const key = ftog.dataset.food;
    foodOpen = (foodOpen === key) ? null : key;
    foodIdx = 0;
    render();
    return;
  }
  // 점을 눌러 메뉴 이동 (마우스·키보드에는 스와이프가 없습니다)
  const dot = e.target.closest('[data-fc-go]');
  if(dot){
    foodShow(dot.closest('.food-card'), +dot.dataset.fcGo, true);
    return;
  }

  // 타임라인의 빈자리 → 선택 카드로 데려갑니다
  if(e.target.closest('[data-gotoopts]')){
    const box = $('#opts');
    if(box) box.scrollIntoView({
      block: 'center', behavior: reduceMotion.matches ? 'auto' : 'smooth',
    });
    return;
  }
  const reopt = e.target.closest('[data-reopt]');
  if(reopt){
    setOption(reopt.dataset.reopt, null);   // 해제하면 다시 카드가 뜹니다
    resetSigs();
    render();
    window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    return;
  }

  const row = e.target.closest('.up-row');
  if(row){ jumpTo(row.dataset.date); return; }

  const node = e.target.closest('.j-node, .pc-city');
  if(node){
    // 여정선은 갈 날짜를 이미 들고 있습니다 (서울이 양 끝에 두 번 나오므로)
    const to = node.dataset.date
      || (DAYS.find(d => d.city === node.dataset.city) || {}).date;
    if(to) jumpTo(to);
  }
});

/* -----------------------------------------------------------
   검색 — "판테온 언제였지" (9/28 외관 / 9/29 내부) 같은 순간용.
   이름·설명·장소·준비물까지 훑습니다.
   ----------------------------------------------------------- */
const findBox = $('#find'), findQ = $('#find-q'), findList = $('#find-list');
let pendingFocus = null;   // 검색 결과로 이동한 뒤 스크롤할 일정 {date, time}

function openFind(){
  findBox.hidden = false;
  findQ.value = '';
  renderFind('');
  setTimeout(() => findQ.focus(), 40);
}
function closeFind(){ findBox.hidden = true; }

function findHits(q){
  const s = q.trim().toLowerCase();
  if(s.length < 1) return [];
  const hits = [];
  for(const d of DAYS){
    // 아직 안 고른 옵션의 일정도 찾을 수 있어야 합니다
    const pool = d.options
      ? d.items.concat(...d.options.map(o => o.items))
      : d.items;
    for(const it of pool){
      const hay = [it.name, it.desc, it.place, ...(it.prep || []),
                   it.meet && it.meet.where].filter(Boolean).join(' ').toLowerCase();
      if(hay.includes(s)) hits.push({ d, it });
      if(hits.length >= 60) return hits;
    }
  }
  /* 먹을 곳 · 기념품도 훑습니다 — "그 카르보나라 집 이름이 뭐였지" 가
     "판테온 언제 가지" 와 똑같은 상황이라서. 일정에 딸린 게 아니라
     도시에 딸린 정보라 시각 대신 도시로 돌려줍니다. */
  for(const c of CITIES){
    for(const [key, pack] of [['food', FOOD[c.id]], ['gift', GIFT[c.id]]]){
      if(!pack) continue;
      const flat = [];
      for(const g of pack.spots || [])
        for(const x of (g && g.list) || [g]) if(x && x.n) flat.push([x, g && g.g]);
      for(const g of pack.buy || [])
        for(const x of g.list || []) flat.push([x, g.g]);
      for(const x of pack.eat || []) flat.push([x, '꼭 먹어볼 것']);
      for(const [x, group] of flat){
        const hay = [x.n, x.d, x.a, group].filter(Boolean).join(' ').toLowerCase();
        if(hay.includes(s)) hits.push({ ref: key, c, x, group });
        if(hits.length >= 60) return hits;
      }
    }
  }
  return hits;
}

function mark(text, q){
  const i = text.toLowerCase().indexOf(q.trim().toLowerCase());
  if(i < 0) return esc(text);
  const n = q.trim().length;
  return esc(text.slice(0, i)) + '<em>' + esc(text.slice(i, i + n)) + '</em>' + esc(text.slice(i + n));
}

function renderFind(q){
  if(!q.trim()){
    findList.innerHTML = `<div class="find-empty">일정 · 장소 · 준비물 · 식당 · 기념품에서 찾습니다</div>`;
    return;
  }
  const hits = findHits(q);
  if(!hits.length){
    findList.innerHTML = `<div class="find-empty">“${esc(q)}” 결과가 없습니다</div>`;
    return;
  }
  findList.innerHTML = hits.map(h => {
    if(h.ref){
      // 도시에 딸린 정보 — 시각 자리에 '먹을 곳' / '기념품' 을 씁니다
      const sub = [h.x.d, h.x.a].filter(Boolean).join(' · ');
      return `<button class="find-row" type="button"
                      data-ref="${esc(h.ref)}" data-city="${esc(h.c.id)}"
                      style="--c:${cityColor(h.c)}">
        <span class="find-d">${esc(h.c.short || h.c.name)}</span>
        <span class="find-t">${h.ref === 'food' ? '먹을 곳' : '기념품'}</span>
        <span class="find-n">${mark(h.x.n, q)}
          ${sub ? `<span class="find-sub">${esc(sub.slice(0, 46))}</span>` : ''}</span>
      </button>`;
    }
    const { d, it } = h;
    const c = cityById(d.city);
    const rel = relLabel(d.date);
    const md = d.date.slice(5).replace('-', '/');
    const sub = it.desc || it.place || (it.meet && it.meet.where) || '';
    return `<button class="find-row" type="button" data-date="${d.date}" data-time="${it.time}"
                    style="--c:${cityColor(c)}">
      <span class="find-d">${rel || md}</span>
      <span class="find-t">${esc(it.time)}</span>
      <span class="find-n">${mark(it.name, q)}
        ${sub ? `<span class="find-sub">${esc(sub.slice(0, 46))}</span>` : ''}</span>
    </button>`;
  }).join('');
}

$('#find-open').addEventListener('click', openFind);
$('#find-close').addEventListener('click', closeFind);
findQ.addEventListener('input', () => renderFind(findQ.value));
findBox.addEventListener('click', (e) => { if(e.target === findBox) closeFind(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && !findBox.hidden) closeFind();
});
findList.addEventListener('click', (e) => {
  const row = e.target.closest('.find-row');
  if(!row) return;
  closeFind();
  /* 먹을 곳 · 기념품 — 그 도시의 첫날로 가서 해당 섹션을 펼쳐 보여줍니다 */
  if(row.dataset.ref){
    const key = row.dataset.ref;
    if(key === 'food') showFood = true; else showGift = true;
    const day = DAYS.find(d => d.city === row.dataset.city);
    if(day) jumpTo(day.date, `#sec-${key}`); else render();
    return;
  }
  pendingFocus = { date: row.dataset.date, time: row.dataset.time };
  // 지난 일정이 접혀 있으면 못 찾으므로 그 날은 펼쳐둡니다
  showPast = true; showPastFor = row.dataset.date;
  jumpTo(row.dataset.date);
});

  if(e.key === 'ArrowLeft')  stepDay(-1);

let tx = 0, ty = 0, tracking = false;
/* 카드 안에서 시작한 제스처는 날짜를 넘기지 않습니다.
   카드가 그 제스처를 가져가고, 날짜 스와이프는 아예 추적을 끕니다. */
let fcCard = null, fcAxis = 0;     // axis: 0 미정 · 1 가로(카드) · -1 세로(스크롤)

document.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  fcCard = e.target.closest('.food-card');
  fcAxis = 0;
  tracking = !fcCard;              // 카드 위에서 시작했으면 날짜 스와이프는 포기
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if(!fcCard || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if(!fcAxis){
    // 가로가 세로보다 확실히 클 때만 카드 스와이프로 판정 — 아니면 세로 스크롤에 양보
    if(Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 30) fcAxis = 1;
    else if(Math.abs(dy) > 12) fcAxis = -1;
    return;
  }
  if(fcAxis !== 1) return;
  e.preventDefault();                                  // 세로 스크롤·화면 당김 방지
  const track = fcCard.querySelector('.fc-track');
  const n = track.children.length;
  let px = dx;
  // 양 끝에서는 저항을 줘서 "끝" 이라는 느낌만 남깁니다
  if((foodIdx === 0 && dx > 0) || (foodIdx === n - 1 && dx < 0)) px = dx * 0.28;
  track.classList.add('drag');
  track.style.transform = `translateX(calc(${-foodIdx * 100}% + ${px}px))`;
}, { passive: false });

document.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;

  if(fcCard){
    if(fcAxis === 1){
      const w = fcCard.clientWidth || 1;
      const step = (Math.abs(dx) > w * 0.22 || Math.abs(dx) > 60) ? (dx < 0 ? 1 : -1) : 0;
      foodShow(fcCard, foodIdx + step, true);          // 못 미치면 제자리로 돌아옵니다
    }
    fcCard = null; fcAxis = 0;
    return;
  }
  if(!tracking) return;
  tracking = false;
  // 세로 스크롤과 헷갈리지 않게 가로가 확실히 클 때만
  if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
  stepDay(dx < 0 ? 1 : -1);
}, { passive: true });

/* -----------------------------------------------------------
   오늘로 이동 (플로팅 버튼)
   ----------------------------------------------------------- */
const fab = $('#to-today');

function updateFab(){
  if(!DAYS.length){ fab.classList.remove('show'); return; }
  // 다른 날을 보고 있으면 항상 노출, 오늘이면 카드가 화면 밖일 때만
  if(viewDate){ fab.classList.add('show'); return; }
  const card = $('#finale').hidden ? $('#now-card') : $('#finale');
  const r = card.getBoundingClientRect();
  const offscreen = r.bottom < 0 || r.top > window.innerHeight;
  fab.classList.toggle('show', offscreen);
}

fab.addEventListener('click', () => {
  if(viewDate){
    goToday();
  }else{
    const card = $('#finale').hidden ? $('#now-card') : $('#finale');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

let fabTick = false;
window.addEventListener('scroll', () => {
  if(fabTick) return;
  fabTick = true;
  requestAnimationFrame(() => { updateFab(); fabTick = false; });
}, { passive: true });

/* -----------------------------------------------------------
   부팅
   ----------------------------------------------------------- */
let booting = false;

function showError(err){
  $('#errbox').hidden = false;
  $('#src-note').hidden = true;
  $('#now-card').hidden = true;
  $('#sec-today').hidden = true;
  $('#sec-upcoming').hidden = true;
  $('#finale').hidden = true;
  $('#strip').innerHTML = '';
  $('#ey-date').textContent = '불러오기 실패';
  $('#err-msg').textContent = navigator.onLine
    ? '네트워크는 연결되어 있지만 일정 파일을 읽지 못했습니다.'
    : '오프라인 상태입니다. 연결되면 자동으로 최신 일정을 받아옵니다.';
  $('#err-why').textContent = err ? `원인: ${err}` : '';
}

async function boot(){
  if(booting) return;
  booting = true;
  $('#err-retry').disabled = true;
  $('#err-retry').textContent = '불러오는 중…';

  let res;
  try{
    res = await loadData();
  }catch(e){
    res = { data: null, source: null, error: e.message || String(e) };
  }

  $('#err-retry').disabled = false;
  $('#err-retry').textContent = '다시 시도';
  booting = false;

  const { data, source, error } = res;

  if(!data){
    // 이미 보여주던 일정이 있으면 화면을 지우지 않습니다.
    // 여행 중에 정보를 빼앗기는 게 최악이라, 알림만 띄우고 그대로 둡니다.
    if(DAYS.length){
      $('#src-note').hidden = false;
      $('#src-text').textContent = `최신 일정을 받지 못했습니다 (${error}). 이전 데이터를 보고 있습니다.`;
    }else{
      showError(error);
    }
    return;
  }

  try{
    TRIP   = data.trip;
    CITIES = data.cities;
    DAYS   = data.days.slice().sort((a,b) => a.date < b.date ? -1 : 1);
    resetSigs();                       // 데이터가 새로 오면 전부 다시 그립니다
    PHRASES  = data.phrases  || {};
    CONTACTS = data.contacts || {};
    FOOD     = data.food     || {};
    GIFT     = data.gift     || {};
    TOTAL_DAYS = daysBetween(TRIP.start, TRIP.end) + 1;
    DATA_SOURCE = source;

    $('#errbox').hidden = true;
    render();
  }catch(e){
    // 데이터는 왔는데 그리다 죽는 경우 — 빈 화면 대신 원인을 보여줍니다
    showError(`화면을 그리지 못했습니다 (${e.message})`);
    return;
  }

  // 네트워크가 아닌 출처면 알려주고 다시 받을 기회를 줍니다
  $('#src-note').hidden = source === 'network';
  if(source !== 'network'){
    $('#src-text').textContent = source === 'cache'
      ? '저장해 둔 일정을 보고 있습니다.'
      : '앱에 내장된 백업 일정입니다. 최신이 아닐 수 있습니다.';
  }
  updateFab();
}

$('#err-retry').addEventListener('click', boot);
$('#src-retry').addEventListener('click', boot);
$('#err-reload').addEventListener('click', () => location.reload());
$('#fin-review').addEventListener('click', () => {
  viewDate = DAYS[0].date;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

boot();

/* 1분마다 갱신 — 자정을 넘기면 날짜가 바뀌므로 보던 날도 오늘로 되돌립니다 */
let lastToday = today();
function tick(){
  if(!DAYS.length) return;
  if(today() !== lastToday){ lastToday = today(); viewDate = null; }
  render();
  updateFab();
}
setInterval(tick, 60000);
setInterval(() => { if(countdownTarget) tickCountdown(); tickLeft(); }, 1000);

// 백그라운드에 오래 있다 돌아오면 1분을 기다리지 않고 바로 맞춥니다
document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });

// 다시 온라인이 되면 조용히 최신 일정으로 교체
window.addEventListener('online', () => { if(DATA_SOURCE !== 'network') boot(); });

/* -----------------------------------------------------------
   서비스 워커
   ----------------------------------------------------------- */
if('serviceWorker' in navigator){
  // 첫 설치 때의 claim 으로는 새로고침하지 않음 (최초 방문 리로드 방지)
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;

  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('service-worker.js', { updateViaCache: 'none' })
      .catch(() => {});
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
}
</script>
