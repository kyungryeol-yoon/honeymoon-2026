<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151F" id="meta-theme">
<meta name="description" content="Kyungryeol & Hojeong · 2026 신혼여행 일정">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Honeymoon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honeymoon 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* 페인트 전에 테마 확정 — FOUC 방지 */
(function(){
  var t;
  try{ t = localStorage.getItem('hm26-theme'); }catch(e){}
  if(t !== 'light' && t !== 'dark'){
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('#meta-theme');
  if(m) m.content = t === 'light' ? '#F7F5F0' : '#12151F';
})();
</script>
<style>
:root{
  --es:#D4744A;
  --ch:#5B94C4;
  --it:#8AA05A;
  --cz:#B0576B;

  --now:var(--city, #D4744A);

  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,monospace;
}

/* ---------- 다크 (기본) ---------- */
:root,
:root[data-theme="dark"]{
  --ink:#12151F;
  --ink-2:#1A1F2E;
  --ink-3:#252B3D;
  --paper:#F2EFE8;
  --paper-dim:#A8AABA;
  /* 글자용 — 예전 값(#5A6076)은 배경 대비 2.9:1 이라 한낮 폰에서 안 읽혔습니다.
     이건 본문 5.28:1 · 카드 위 4.76:1 (WCAG AA 4.5:1) */
  --paper-faint:#828A9F;
  /* 점·점선 전용. 글자와 요구 대비가 달라(비문자 3:1) 나눠 뒀습니다 —
     같이 밝히면 지난 일정·완주 구간이 현재보다 튑니다. 예전 --paper-faint 값. */
  --hairline:#5A6076;
  --line:#2E3448;
  --hush:#2E3448;
  --glow:.16;
  --fill-op:.14;
  --card-shadow:none;
  --scrim:rgba(0,0,0,.5);
}

/* ---------- 라이트 ---------- */
:root[data-theme="light"]{
  --ink:#F7F5F0;
  --ink-2:#FFFFFF;
  --ink-3:#F2EEE5;
  --paper:#1A1F2E;
  --paper-dim:#4A5164;
  --paper-faint:#686E80;   /* 본문 4.67:1 · 카드 위 5.08:1 (was #767C8E, 3.82:1) */
  --hairline:#767C8E;
  --line:#E0DCD3;
  --hush:#C9C4B8;
  --glow:.13;
  --fill-op:.13;
  --card-shadow:0 1px 2px rgba(26,31,46,.05), 0 10px 26px -16px rgba(26,31,46,.28);
  --scrim:rgba(26,31,46,.42);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* 히어로 글로우가 좌우로 넘쳐 가로 스크롤이 생기지 않도록 */
html{overflow-x:clip}

body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
  transition:background-color .25s ease,color .25s ease;
}

.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
.hero{
  padding:calc(28px + env(safe-area-inset-top)) 0 22px;
  position:relative;
}
.hero::before{
  content:"";position:absolute;inset:-40% -50% auto;height:420px;
  background:radial-gradient(ellipse at 50% 0%,var(--now) 0%,transparent 62%);
  opacity:var(--glow);pointer-events:none;
}

.eyebrow{
  font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--paper-faint);
  display:flex;align-items:center;gap:7px;
  padding-right:44px;
  min-height:28px;
}
.eyebrow b{color:var(--now);font-weight:500}

/* ---------- 날짜 이동 ---------- */
.nav-btn{
  width:26px;height:26px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:none;border:1px solid transparent;
  color:var(--paper-faint);cursor:pointer;
  font:400 17px/1 var(--f-body);padding:0 0 2px;
  transition:color .15s,border-color .15s;
}
.nav-btn:hover:not(:disabled){color:var(--now);border-color:var(--line)}
.nav-btn:active:not(:disabled){transform:scale(.9)}
.nav-btn:disabled{opacity:.25;cursor:default}
.today-pill{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;
  border:1px solid var(--now);color:var(--now);background:none;
  cursor:pointer;flex:0 0 auto;
}
.today-pill[hidden]{display:none}

/* ---------- 테마 토글 ---------- */
.theme-toggle{
  position:absolute;
  top:calc(22px + env(safe-area-inset-top));
  right:0;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--ink-2);
  border:1px solid var(--line);
  color:var(--paper-dim);
  cursor:pointer;
  transition:color .2s,border-color .2s,background-color .25s;
  z-index:2;
}
.theme-toggle:hover{color:var(--now);border-color:color-mix(in srgb,var(--now) 45%,var(--line))}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle svg{width:17px;height:17px;display:none}
:root[data-theme="dark"] .theme-toggle .i-moon{display:block}
:root[data-theme="light"] .theme-toggle .i-sun{display:block}

/* ---------- 검색 ----------
   360개 일정이라 "판테온 언제였지"(9/28 외관 / 9/29 내부)를
   날짜 넘기며 찾기 어렵습니다. 자주 쓰진 않으니 헤더 아이콘으로만 둡니다. */
.find-toggle{right:44px}
.find-toggle svg{width:16px;height:16px;display:block}

#find{
  position:fixed;inset:0;z-index:60;
  background:color-mix(in srgb,var(--ink) 92%,transparent);
  backdrop-filter:blur(6px);
  display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 0 0;
}
#find[hidden]{display:none}
.find-bar{
  display:flex;align-items:center;gap:10px;
  max-width:520px;width:100%;margin:0 auto;padding:0 20px 12px;
}
.find-bar input{
  flex:1 1 auto;min-width:0;
  background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;color:var(--paper);font:inherit;font-size:15px;
}
.find-bar input:focus{outline:none;border-color:var(--now)}
.find-bar input::placeholder{color:var(--paper-faint)}
.find-close{
  flex:0 0 auto;background:none;border:0;color:var(--paper-dim);
  font:inherit;font-size:13px;cursor:pointer;padding:6px 2px;
}
.find-list{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-width:520px;width:100%;margin:0 auto;padding:0 20px 40px;
}
.find-row{
  display:flex;align-items:baseline;gap:10px;width:100%;
  padding:11px 12px;margin-bottom:7px;border-radius:10px;
  background:var(--ink-2);border:1px solid var(--line);
  color:inherit;font:inherit;text-align:left;cursor:pointer;
}
.find-row:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.find-d{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--c,var(--paper-faint));flex:0 0 62px;
}
.find-t{font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);flex:0 0 auto}
.find-n{flex:1 1 auto;min-width:0;font-size:14px}
.find-n em{font-style:normal;color:var(--now);font-weight:600}
.find-sub{display:block;font-size:11.5px;color:var(--paper-faint);margin-top:2px}
.find-empty{
  text-align:center;color:var(--paper-faint);font-size:13px;padding:34px 0;
}
/* 검색으로 찾아간 일정 잠깐 강조 */
.tl li.found::after{
  content:"";position:absolute;inset:-6px -10px;border-radius:10px;
  border:1px solid var(--now);pointer-events:none;
  animation:found-fade 2.4s ease forwards;
}
@keyframes found-fade{0%,60%{opacity:1}100%{opacity:0}}

/* 도시 랜드마크 아이콘 */
.landmark{
  margin:18px 0 12px;
  height:96px;
  display:flex;align-items:flex-end;
}
.landmark svg{height:100%;width:auto;overflow:visible}

/* 날짜를 넘기면 랜드마크와 도시명이 진행 방향으로 교체됩니다 */
.landmark.in-fwd svg,.city-name.in-fwd{animation:slide-fwd .42s cubic-bezier(.2,.8,.25,1) both}
.landmark.in-back svg,.city-name.in-back{animation:slide-back .42s cubic-bezier(.2,.8,.25,1) both}
.city-name.in-fwd,.city-name.in-back{animation-delay:60ms}
@keyframes slide-fwd{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slide-back{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* 앱을 열 때 헤더가 한 번 올라옵니다 (짧게) */
.hero.boot .landmark,.hero.boot .city-name,.hero.boot .city-sub,.hero.boot .journey{
  animation:hero-in .5s cubic-bezier(.2,.8,.3,1) both;
}
.hero.boot .city-name{animation-delay:60ms}
.hero.boot .city-sub{animation-delay:110ms}
.hero.boot .journey{animation-delay:155ms}
@keyframes hero-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lm-stroke{fill:none;stroke:var(--now);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lm-fill{fill:var(--now);opacity:var(--fill-op)}
.lm-dim{fill:none;stroke:var(--now);stroke-width:1.2;opacity:.45}

.city-name{
  font-family:var(--f-display);
  font-size:clamp(38px,11vw,52px);
  line-height:.95;
  letter-spacing:-.015em;
  font-weight:400;
}
.city-sub{
  margin-top:10px;
  font-size:13.5px;
  color:var(--paper-dim);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.city-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--line)}

/* ---------- 여정 라인 (시그니처) ---------- */
.journey{
  margin:26px 0 8px;
  padding:18px 0 4px;
  border-top:1px solid var(--line);
}
.j-track{
  display:flex;align-items:center;
  width:100%;
}
.j-node{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 0 auto;position:relative;
  background:none;border:0;padding:2px 4px 0;margin:0;
  font:inherit;color:inherit;cursor:pointer;
}
/* 탭 영역을 점 크기보다 넉넉하게 */
.j-node::after{content:"";position:absolute;inset:-8px -6px -4px}
.j-node:hover .j-label{color:var(--now)}
.j-node:hover .j-dot{border-color:var(--now)}
.j-node:active{transform:scale(.92)}
.j-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--line);
  transition:all .3s;
}
.j-node.done .j-dot{background:var(--hairline);border-color:var(--hairline)}
.j-node.here .j-dot{
  width:13px;height:13px;
  background:var(--now);border-color:var(--now);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent);
  animation:j-halo 3.2s ease-in-out infinite;
}
@keyframes j-halo{
  0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent)}
  50%    {box-shadow:0 0 0 8px color-mix(in srgb,var(--now)  7%,transparent)}
}
.j-label{
  font-family:var(--f-mono);
  font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper-faint);white-space:nowrap;
}
.j-node.here .j-label{color:var(--now)}
.j-seg{flex:1 1 auto;height:1.5px;background:var(--line);margin:0 3px;margin-bottom:22px;border-radius:2px}
.j-seg.done{background:var(--hairline)}
.j-seg.pending{
  background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  height:1.5px;
}

.j-meta{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-top:14px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--paper-faint);
}
#j-route{min-width:0}
/* 나라는 도시보다 한 단계 뒤로 물려 "나라 도시" 가 한 덩어리로 읽히게 */
.ctry{opacity:.6;letter-spacing:.04em;margin-right:1px}
#j-prog,#j-total{white-space:nowrap}
.j-meta > span:last-child{flex:0 0 auto}
.j-meta b{color:var(--paper-dim);font-weight:500}

/* ---------- NOW 카드 ---------- */
.now-card{
  margin:22px 0 0;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  position:relative;overflow:hidden;
  box-shadow:var(--card-shadow);
}
.now-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--now);
}
.nc-tag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--now);display:flex;align-items:center;gap:6px;
}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--now);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.nc-title{font-size:19px;font-weight:600;margin:9px 0 3px;letter-spacing:-.01em}
.nc-time{font-family:var(--f-mono);font-size:12px;color:var(--paper-dim)}
.nc-time .rest{color:var(--paper-faint)}

/* 지난 일정 접기 — 밤에 열면 하루의 절반 이상이 이미 끝난 일정입니다 */
.past-fold{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin:0 0 16px;padding:9px 12px;
  background:none;border:1px dashed var(--line);border-radius:10px;
  color:var(--paper-faint);font:inherit;font-size:12px;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.past-fold:hover{color:var(--now);border-color:color-mix(in srgb,var(--now) 40%,var(--line))}
.past-fold:active{transform:scale(.99)}
.past-fold svg{width:12px;height:12px;flex:0 0 auto;transition:transform .2s ease}
.past-fold[aria-expanded="true"] svg{transform:rotate(180deg)}
.past-fold[hidden]{display:none}
.nc-next{
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;gap:9px;font-size:13.5px;color:var(--paper-dim);
}
.nc-next .t{font-family:var(--f-mono);font-size:11.5px;color:var(--paper-faint);flex:0 0 auto}
.nc-next[hidden]{display:none}
/* 다음 일정까지 남은 시간 — 시각을 빼는 암산을 대신합니다.
   시차에 절어 있을 때 "지금 몇 시더라" 부터 시작하면 부담이 큽니다. */
.nc-next .left{
  flex:0 0 auto;font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;
  padding:1px 6px;border-radius:100px;
  border:1px solid var(--line);color:var(--paper-dim);
}
.nc-next .left[hidden]{display:none}
/* 15분 안쪽이면 눈에 띄게 — 투어 미팅을 놓치면 그날이 날아갑니다 */
.nc-next .left.soon{
  border-color:var(--now);color:var(--now);
  background:color-mix(in srgb,var(--now) 12%,transparent);
}
/* 내일 첫 일정이 이른 새벽이면 자기 전에 확실히 보이도록 */
.nc-next.early{color:var(--now);font-weight:500}
.nc-next.early .t{color:var(--now);font-weight:600}

/* D-day 카운트다운 */
.now-card.countdown .nc-title{
  font-family:var(--f-mono);
  font-size:23px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  margin:11px 0 4px;
}
.dday{
  font-family:var(--f-display);
  font-size:15px;color:var(--now);letter-spacing:.02em;
}

/* ---------- 알림 스트립 ---------- */
.strip{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}
.chip{
  font-size:11.5px;padding:6px 11px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
  display:flex;align-items:center;gap:5px;
}
.chip.warn{border-color:color-mix(in srgb,var(--now) 45%,var(--line));color:var(--now)}
/* 오늘 필요한 현금 — 호텔 나서기 전에 보는 값이라 제일 눈에 띄게 */
.chip.cash{
  background:color-mix(in srgb,var(--now) 13%,var(--ink-2));
  border-color:color-mix(in srgb,var(--now) 50%,var(--line));
  color:var(--now);font-weight:600;
}
.chip.cash .amt{font-family:var(--f-mono);letter-spacing:.02em}
.chip.cash svg{width:11px;height:11px;flex:0 0 auto}

/* 오늘 밤 묵는 곳 — 탭하면 주소가 복사됩니다 (택시에서 보여줄 한 줄) */
.chip.stay{
  gap:6px;cursor:pointer;font:inherit;font-size:11.5px;
  color:var(--paper-dim);
  border-style:solid;
}
.chip.stay svg{width:12px;height:12px;flex:0 0 auto;opacity:.75}
.chip.stay:active{border-color:var(--now);color:var(--now)}
.chip.stay.copied{border-color:var(--now);color:var(--now)}
.chip.stay.copied svg{opacity:1}

/* 오프라인 안내 — 지도가 안 열리는 이유를 미리 알려줍니다 */
.netnote{
  margin-top:10px;padding:9px 12px;border-radius:9px;
  font-size:11.5px;line-height:1.55;
  color:var(--paper-dim);
  background:var(--ink-2);border:1px dashed var(--line);
}
.netnote[hidden]{display:none}

/* ---------- 타임라인 ---------- */
section{margin-top:34px}
.sec-head{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--paper-faint);margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
/* 접히는 섹션 제목 — 한마디처럼 참고용이라 평소엔 닫아둡니다 */
.sec-fold{
  width:100%;background:none;border:0;padding:0;margin-bottom:14px;
  font:inherit;font-family:var(--f-mono);color:var(--paper-faint);cursor:pointer;
  text-align:left;
}
.sec-fold:hover{color:var(--now)}
.sec-fold > svg{width:11px;height:11px;flex:0 0 auto;transition:transform .2s ease}
.sec-fold[aria-expanded="true"] > svg{transform:rotate(180deg)}
.sec-fold > span{flex:0 0 auto;white-space:nowrap}
.sec-fold .cnt{
  font-size:9px;letter-spacing:.1em;opacity:.6;
  padding:2px 6px;border:1px solid var(--line);border-radius:100px;
}
/* 제목 뒤 가로선이 카운트 앞에 오도록 순서 조정 */
.sec-fold::after{order:1}
.sec-fold .cnt{order:2}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line)}

.tl{list-style:none;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}

.tl li{position:relative;padding:0 0 20px}

/* 날짜를 넘겼을 때만 일정이 차례로 올라옵니다.
   1분마다 도는 자동 갱신에서는 재생되지 않게 .enter 를 그때만 붙입니다 */
.tl.enter li{animation:tl-in .4s cubic-bezier(.2,.8,.3,1) both}
.tl.enter li:nth-child(1){animation-delay:0ms}
.tl.enter li:nth-child(2){animation-delay:34ms}
.tl.enter li:nth-child(3){animation-delay:68ms}
.tl.enter li:nth-child(4){animation-delay:100ms}
.tl.enter li:nth-child(5){animation-delay:128ms}
.tl.enter li:nth-child(6){animation-delay:152ms}
.tl.enter li:nth-child(7){animation-delay:172ms}
.tl.enter li:nth-child(n+8){animation-delay:188ms}
@keyframes tl-in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.tl li::before{
  content:"";position:absolute;left:-22px;top:6px;
  width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--line);
}
.tl li.past{opacity:.42}
.tl li.past::before{background:var(--hairline);border-color:var(--hairline)}
.tl li.live::before{
  background:var(--now);border-color:var(--now);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 20%,transparent);
}
.tl-t{font-family:var(--f-mono);font-size:11.5px;color:var(--paper-dim);letter-spacing:.04em}
.tl li.live .tl-t{color:var(--now)}
/* 색만으로 현재/지난 일정을 구분하지 않도록 글자도 함께 */
.tl li.live .tl-t::after{content:" · 지금";font-weight:600;letter-spacing:.08em}
/* 현지 시각 옆 한국 시간 — 참고값이라 한 단계 흐리게 */
/* 위계는 불투명도가 아니라 토큰으로 — opacity 를 곱하면 실효 대비가
   1.72:1 까지 떨어져 배경과 구분이 안 됐습니다. */
.kst{margin-left:8px;color:var(--paper-faint);font-size:10.5px;letter-spacing:.02em}
/* .kst 에 색을 직접 주면 아래 .tl li.live 의 도시 색 상속이 끊깁니다 */
.tl li.live .kst{color:var(--now)}
.kst sup{font-size:8px;vertical-align:super;margin-left:1px}
/* 그 시각이 어느 공항 시계인지 (하루에 시계가 바뀌는 날에만) */
.tzl{
  margin-left:7px;padding:1px 5px;border-radius:4px;
  font-size:9px;letter-spacing:.08em;
  border:1px solid var(--line);color:var(--paper-faint);
}
.tl-n{font-size:15px;margin-top:2px;font-weight:450}

/* 종류 이모지 — 이름 앞에 붙습니다.
   기기마다 자체 색으로 그려지므로 도시 색이 먹지 않습니다.
   대신 폭을 고정해 이모지가 없는 줄과도 이름 왼쪽이 맞습니다. */
.kind{
  display:inline-block;width:1.25em;margin-right:5px;
  font-size:13.5px;line-height:1;text-align:center;
  /* 컬러 이모지는 다크 모드에서 과하게 튑니다 */
  opacity:.9;
  /* 장식이라 선택에서 뺍니다 — 식당 이름을 길게 눌러 복사할 때
     "🍴Roscioli" 가 아니라 "Roscioli" 가 나와야 지도에 그대로 붙습니다 */
  user-select:none;-webkit-user-select:none;
}
.tl li.past .kind{opacity:.5}
/* 예약 완료 — 시각 옆, 작게 */
.bk{margin-left:7px;font-size:9.5px;vertical-align:1px;opacity:.85;
  user-select:none;-webkit-user-select:none}
.tl li.past .bk{opacity:.45}
.tl li.live .tl-n{font-weight:600}

/* 아직 안 고른 선택 일정이 들어갈 자리.
   9/20 처럼 공통이 4개뿐인 날은 이게 없으면 아침~저녁이 통째로 비어 보입니다. */
.tl li.gap{padding-bottom:20px}
.tl li.gap::before{
  background:transparent;border-style:dashed;border-color:var(--hairline);
}
.opt-gap{
  display:block;width:100%;text-align:left;
  border:1px dashed var(--line);border-radius:10px;
  padding:11px 13px;background:transparent;cursor:pointer;
  color:var(--paper-faint);font:inherit;
}
.opt-gap:hover,.opt-gap:focus-visible{border-color:var(--now);color:var(--paper)}
.opt-gap .g-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em}
.opt-gap .g-n{display:block;margin-top:3px;font-size:14px}

/* ---------- 식사 항목의 음식 카드 ----------
   "지금 이 끼니에 뭘 먹지" 를 위아래 일정과 같이 보려고 그 자리에 폅니다.
   높이는 고정 — 메뉴를 넘길 때 아래 일정이 밀리면 시간 비교가 안 됩니다. */
/* button 은 UA 기본 색(검정)을 씁니다 — color 를 안 주면 어두운 배경에서
   글자가 사라집니다. 배경색도 마찬가지로 명시해야 합니다. */
.food-tog{
  display:inline-flex;align-items:center;gap:4px;
  margin-left:7px;vertical-align:1px;
  padding:2px 8px 2px 6px;
  border:1px solid var(--city, var(--line));border-radius:100px;
  background:color-mix(in srgb, var(--city, var(--line)) 14%, transparent);
  color:var(--paper);cursor:pointer;
  font:inherit;font-size:10.5px;letter-spacing:.02em;line-height:1.6;
  user-select:none;-webkit-user-select:none;
}
.food-tog .fk{font-size:11px;line-height:1}
.food-tog:hover,.food-tog:focus-visible{
  background:color-mix(in srgb, var(--city, var(--line)) 26%, transparent);
}
.food-tog[aria-expanded="true"]{
  background:color-mix(in srgb, var(--city, var(--line)) 30%, transparent);
}
.food-card{
  margin-top:9px;border:1px solid var(--line);border-radius:12px;
  background:var(--ink-2);overflow:hidden;
}
.fc-win{overflow:hidden;height:118px}          /* ← 고정 높이 */
.fc-track{display:flex;height:100%;transition:transform .26s cubic-bezier(.2,.8,.3,1)}
.fc-track.drag{transition:none}
.fc-item{
  flex:0 0 100%;min-width:0;padding:11px 13px;
  display:flex;flex-direction:column;gap:3px;
}
.fc-top{display:flex;align-items:baseline;gap:8px}
.fc-n{font-size:14.5px;font-weight:600;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.fc-p{
  flex:0 0 auto;font-family:var(--f-mono);font-size:11px;
  color:var(--now);letter-spacing:.02em;
}
.fc-d{font-size:12px;color:var(--paper-dim);line-height:1.45}
.fc-w{font-size:11.5px;color:var(--paper);line-height:1.4}
.fc-t{font-size:11px;color:var(--paper-faint);line-height:1.4}
/* 길이가 제각각이라 넘치면 자릅니다 — 높이가 흔들리면 안 되므로 */
.fc-d,.fc-w,.fc-t{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.fc-bar{
  display:flex;align-items:center;gap:8px;
  padding:7px 13px 9px;border-top:1px solid var(--line);
}
.fc-dots{display:flex;gap:5px;flex:1 1 auto;flex-wrap:wrap}
.fc-dot{
  width:6px;height:6px;padding:0;border:0;border-radius:50%;
  background:var(--hairline);opacity:.4;cursor:pointer;
}
.fc-dot.on{opacity:1;background:var(--now)}
.fc-cnt{font-family:var(--f-mono);font-size:10.5px;color:var(--paper-faint);flex:1 1 auto}
.fc-note{
  flex:0 0 auto;max-width:62%;text-align:right;
  font-size:10px;color:var(--paper-faint);line-height:1.35;
}
@media (prefers-reduced-motion: reduce){ .fc-track{transition:none} }

/* 칩이 여럿 붙는 줄이 있어 (식사 = 뭐 먹지 + 이 말 하면 돼) 줄바꿈을 허용합니다 */
.tl-n{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px}
.tl-n > .map-link{margin-right:2px}

/* 빈 시간 — 일정이 아니라 여백이라 점을 비우고 한 단계 흐리게 */
.tl li.gap-row{padding-bottom:20px}
.tl li.gap-row::before{background:transparent;border-style:dotted;border-color:var(--hairline)}
.gap-tog{opacity:.75}
.gap-tog:hover,.gap-tog[aria-expanded="true"]{opacity:1}

/* ---------- 하이라이트 (그날의 명장면) ---------- */
.tl li.star .tl-n{font-size:16.5px;font-weight:600;letter-spacing:-.012em}
.tl li.star::before{background:var(--now);border-color:var(--now);opacity:.5}
.tl li.star.live::before{opacity:1}
.tl li.star.past::before{opacity:.5}
.star-mark{
  display:inline-block;width:11px;height:11px;margin-right:6px;
  color:var(--now);vertical-align:-1px;
}
.star-mark svg{width:100%;height:100%;display:block}
/* 날이 바뀔 때만 살짝 피어납니다 */
.tl.enter li.star .star-mark{animation:bloom .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:inherit}
@keyframes bloom{from{opacity:0;transform:scale(.3) rotate(-40deg)}to{opacity:1;transform:none}}
.tl-d{font-size:12.5px;color:var(--paper-faint);margin-top:3px;line-height:1.5}

/* 장소명 → 구글맵 딥링크 */
.map-link{
  color:inherit;text-decoration:none;
  border-bottom:1px dashed color-mix(in srgb,var(--hairline) 70%,transparent);
  padding-bottom:1px;
  display:inline-flex;align-items:center;gap:5px;
}
.map-link:active{color:var(--now)}
.pin{width:10px;height:10px;flex:0 0 auto}
.map-link .pin{color:var(--paper-faint);opacity:.8}
.tl li.live .map-link .pin{color:var(--now);opacity:1}

/* 모임 장소 — 투어는 늦으면 끝이라 이름 바로 아래 강조 */
.meet{
  display:flex;align-items:baseline;gap:7px;margin-top:5px;
  font-size:12.5px;color:var(--now);
}
.meet .mt{font-family:var(--f-mono);font-size:11px;flex:0 0 auto;opacity:.9}
.meet a{
  color:inherit;text-decoration:none;
  border-bottom:1px dashed color-mix(in srgb,var(--now) 55%,transparent);
  display:inline-flex;align-items:center;gap:5px;
}
.meet .pin{width:11px;height:11px;color:inherit;opacity:.95}

/* 다음 일정까지의 이동 */
.mv{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;
  color:var(--paper-faint);
}
.mv svg{width:12px;height:12px;flex:0 0 auto;opacity:.7}
/* 시트에 없어 계산해 넣은 소요시간 — 확정값과 구분 */
.mv .est{font-style:normal;opacity:.55}

/* 일정별 준비물 */
.prep{display:flex;align-items:flex-start;gap:6px;margin-top:7px}
.prep .ic{width:11px;height:11px;flex:0 0 auto;color:var(--paper-faint);opacity:.8;margin-top:5px}
.prep .tags{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0}
.prep i{
  font-style:normal;font-size:11px;letter-spacing:.01em;line-height:1.45;
  padding:3px 9px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
}
.tl li.live .prep .ic{color:var(--now);opacity:1}
.tl li.live .prep i{border-color:color-mix(in srgb,var(--now) 32%,var(--line))}

/* 예약번호 → 클립보드 복사 */
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ref{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;
  padding:4px 9px;border-radius:7px;
  background:var(--ink-2);border:1px dashed var(--line);
  color:var(--paper-dim);
  display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;
}
.ref:active{border-color:var(--now);color:var(--now)}
.ref .lb{color:var(--paper-faint);font-size:10px}
.ref .cp{width:11px;height:11px;flex:0 0 auto;opacity:.7}
.ref.copied{border-style:solid;border-color:var(--now);color:var(--now)}
/* 가려진 예약번호 — 화면엔 뒤 4자리만, 복사는 원본 */
.ref .masked{letter-spacing:.08em}
.ref.note-only{cursor:default;border-style:dotted}
.ref.note-only .cp{display:none}

/* 바깥 링크 (웹캠 등) */
.exts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ext{
  font-size:11px;letter-spacing:.01em;
  padding:4px 9px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);
  color:var(--paper-dim);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.ext:active{border-color:var(--now);color:var(--now)}
.ext .ex{width:10px;height:10px;flex:0 0 auto;opacity:.7}
.tl li.live .ext{border-color:color-mix(in srgb,var(--now) 32%,var(--line))}

/* ---------- 한마디 (현지어 프리셋) ---------- */
.phr{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.phr-row{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  padding:11px 12px;border-radius:10px;text-align:left;
  background:var(--ink-2);border:1px solid var(--line);
  color:inherit;font:inherit;cursor:pointer;
}
.phr-row:active{border-color:var(--now)}
.phr-row.copied{border-color:var(--now)}
.phr-row .ic{width:12px;height:12px;flex:0 0 auto;color:var(--paper-faint);opacity:.8;margin-top:3px}
.phr-row.copied .ic{color:var(--now);opacity:1}
.phr-b{flex:1 1 auto;min-width:0}
.phr-ko{display:block;font-size:11px;color:var(--paper-faint);letter-spacing:.01em}
.phr-x{display:block;font-size:14.5px;margin-top:3px;line-height:1.45}
.phr-r{display:block;font-size:11.5px;color:var(--paper-dim);margin-top:3px;letter-spacing:.01em}
.phr-lang{
  font-size:11px;color:var(--paper-faint);letter-spacing:.02em;
  margin-top:8px;
}
/* 현지어 묶음과 영어 묶음 사이 구분 */
.phr-sub{
  display:flex;align-items:center;gap:9px;margin:8px 0 2px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--paper-faint);
}
.phr-sub::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- 긴급 연락처 ---------- */
/* tel: 은 네트워크가 없어도 걸립니다 — 오프라인에서도 그대로 동작하는 화면 */
/* 먹을 곳 — 그날 도시의 필수 음식 · 추천 식당.
   식당 한 줄은 탭하면 구글맵으로 갑니다 (일정 카드의 지도 링크와 같은 동작) */
.food{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.eat-list{display:flex;flex-wrap:wrap;gap:5px}
.eat-i{
  font-size:11px;letter-spacing:.01em;line-height:1.45;
  padding:4px 9px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
}
.eat-i b{font-weight:500;color:var(--paper)}
.eat-i .star-mark{width:9px;height:9px;margin-right:4px}
.eat-row{
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 11px;border:1px solid var(--line);border-radius:12px;
  color:inherit;text-decoration:none;background:var(--ink-2);
}
.eat-row:active{border-color:var(--now)}
.eat-row .pin{width:12px;height:12px;flex:0 0 auto;color:var(--paper-faint);opacity:.8;margin-top:3px}
.eat-b{flex:1 1 auto;min-width:0}
.eat-n{display:block;font-size:13px;line-height:1.4}
.eat-d{display:block;font-size:11.5px;color:var(--paper-faint);margin-top:3px;line-height:1.45}
.eat-a{
  flex:0 0 auto;align-self:center;max-width:38%;
  font-size:10.5px;color:var(--paper-dim);text-align:right;line-height:1.35;
}
.eat-tips{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.eat-tip{
  display:flex;gap:7px;font-size:11.5px;color:var(--paper-dim);line-height:1.5;
}
.eat-tip::before{content:"·";color:var(--paper-faint);flex:0 0 auto}
.sos{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sos-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:10px;
  background:var(--ink-2);border:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.sos-row:active{border-color:var(--now)}
.sos-row .ic{width:13px;height:13px;flex:0 0 auto;color:var(--paper-faint);opacity:.8}
.sos-b{flex:1 1 auto;min-width:0}
.sos-l{display:block;font-size:12.5px;line-height:1.4}
.sos-n{
  display:block;font-family:var(--f-mono);font-size:11px;
  color:var(--paper-faint);letter-spacing:.03em;margin-top:2px;
}
.sos-t{
  font-family:var(--f-mono);font-size:13.5px;letter-spacing:.02em;
  color:var(--paper-dim);flex:0 0 auto;
}
/* 112 · 144 처럼 바로 거는 번호는 눈에 띄게 */
.sos-row.hot{border-color:color-mix(in srgb,var(--now) 50%,var(--line))}
.sos-row.hot .ic,
.sos-row.hot .sos-t{color:var(--now)}

/* ---------- 접힌 날들 ---------- */
.upcoming{margin-top:10px}
.up-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;
  width:100%;background:none;border-left:0;border-right:0;border-top:0;
  color:inherit;font:inherit;text-align:left;
}
.up-row:first-child{border-top:1px solid var(--line)}
.up-date{font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);flex:0 0 46px;letter-spacing:.04em}
.up-city{font-size:14px;flex:1}
/* 색 막대 대신 그날 도시의 랜드마크 (이미 그려둔 것을 재사용) */
.up-ico{
  width:30px;height:24px;flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:center;
  color:var(--c,var(--line));opacity:.85;
}
.up-ico svg{height:100%;width:auto;overflow:visible}
.up-ico .lm-stroke{stroke:currentColor;stroke-width:2.6}
.up-ico .lm-dim{display:none}
.up-ico .lm-fill{fill:currentColor;opacity:.16}
.up-row:hover .up-ico{opacity:1}
.up-arrow{color:var(--paper-faint);font-size:15px}
.up-row:active .up-arrow{color:var(--now)}
.up-cash{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;
  color:var(--c,var(--paper-faint));flex:0 0 auto;
}

footer{
  margin:44px 0 30px;text-align:center;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  color:var(--hush);text-transform:uppercase;
}

/* 스크린리더 전용 — 색으로만 구분되지 않게 텍스트를 함께 넣습니다 */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- 상태 / 토스트 ---------- */
.offline-note{
  margin-top:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--paper-faint);
}

/* ---------- 로딩 실패 화면 ---------- */
.errbox{
  margin:26px 0 0;padding:20px;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid color-mix(in srgb,var(--now) 40%,var(--line));
  border-radius:14px;box-shadow:var(--card-shadow);
}
.errbox h2{
  font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:7px;
}
.errbox p{font-size:13px;color:var(--paper-dim);line-height:1.65}
.errbox .why{
  margin-top:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--paper-faint);word-break:break-all;
}
.errbox .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;font-weight:500;
  padding:9px 16px;border-radius:100px;cursor:pointer;
  background:var(--now);border:1px solid var(--now);color:var(--ink);
}
.btn.ghost{background:none;color:var(--paper-dim);border-color:var(--line)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}

/* 네트워크 대신 캐시·백업으로 뜬 경우 알림 */
.src-note{
  display:flex;align-items:center;gap:7px;
  margin:14px 0 0;padding:9px 13px;border-radius:10px;
  background:var(--ink-2);border:1px dashed var(--line);
  font-size:11.5px;color:var(--paper-dim);
}
.src-note button{
  margin-left:auto;font:inherit;font-size:11px;background:none;border:0;
  color:var(--now);cursor:pointer;padding:2px 4px;flex:0 0 auto;
}
.src-note[hidden]{display:none}

/* ---------- 오늘로 이동 (플로팅) ---------- */
#to-today{
  position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:6px;
  padding:11px 16px;border-radius:100px;
  background:var(--now);border:0;color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;
  box-shadow:0 6px 22px -6px var(--scrim);
  cursor:pointer;z-index:40;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
#to-today.show{opacity:1;transform:none;pointer-events:auto}
#to-today svg{width:13px;height:13px}

/* ---------- 선택 가능한 일정 ----------
   날씨·컨디션 보고 당일 고르는 날이 있습니다. 고르기 전에는 카드로 늘어놓고,
   고르면 그 옵션의 일정이 공통 일정과 합쳐져 타임라인에 들어갑니다. */
.opts{margin:22px 0 0}
.opt-head{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--paper-faint);
}
.opt-head::after{content:"";flex:1;height:1px;background:var(--line)}
.opt-grid{display:flex;flex-direction:column;gap:9px}
.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  padding:14px 15px;border-radius:12px;
  background:var(--ink-2);border:1px solid var(--line);color:inherit;font:inherit;
  transition:border-color .18s,transform .15s;
}
.opt:hover{border-color:color-mix(in srgb,var(--now) 50%,var(--line))}
.opt:active{transform:scale(.99)}
.opt.rec{border-color:color-mix(in srgb,var(--now) 42%,var(--line))}
.opt-t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.opt-badge{
  font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:2px 7px;border-radius:100px;border:1px solid var(--now);color:var(--now);
}
.opt-s{display:block;font-size:12.5px;color:var(--paper-dim);margin-top:5px;line-height:1.55}
.opt-c{
  display:flex;align-items:center;gap:5px;margin-top:9px;
  font-family:var(--f-mono);font-size:10.5px;color:var(--now);
}
.opt-c svg{width:11px;height:11px}
.opts[hidden]{display:none}

/* 고른 뒤 헤더에 붙는 표시 */
.chip.opt-on{
  background:color-mix(in srgb,var(--now) 12%,var(--ink-2));
  border-color:color-mix(in srgb,var(--now) 45%,var(--line));
  color:var(--now);cursor:pointer;
}
.chip.opt-on svg{width:11px;height:11px;flex:0 0 auto}

/* ---------- 출발 전 · 만나러 가는 곳 ----------
   9/14 까지 35일 동안은 이 화면이 앱의 거의 전부라, 카운트다운만 두면
   허전합니다. 갈 도시들을 랜드마크로 늘어놓고 탭하면 그 도시로 갑니다. */
.preview-cities{margin:22px 0 0}
.pc-head{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--paper-faint);margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.pc-head::after{content:"";flex:1;height:1px;background:var(--line)}
/* 6개를 한 줄로 놓으면 폰에서 도시명이 잘려서 3열 2행으로 */
.pc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc-city{
  min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:14px 6px 11px;border-radius:12px;
  background:none;border:1px solid var(--line);
  color:inherit;font:inherit;cursor:pointer;
  transition:border-color .18s,transform .18s;
}
.pc-city:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-2px)}
.pc-city:active{transform:translateY(0) scale(.97)}
.pc-ico{height:34px;display:flex;align-items:flex-end;color:var(--c)}
.pc-ico svg{height:100%;width:auto;overflow:visible}
.pc-ico .lm-stroke{stroke:currentColor;stroke-width:2.4}
.pc-ico .lm-dim{display:none}
.pc-ico .lm-fill{fill:currentColor;opacity:.15}
.pc-name{font-size:11.5px;color:var(--paper-dim);white-space:nowrap}
.preview-cities[hidden]{display:none}
/* 순서대로 하나씩 나타납니다 */
.pc-row.enter .pc-city{animation:pc-in .45s cubic-bezier(.2,.8,.3,1) both}
.pc-row.enter .pc-city:nth-child(2){animation-delay:55ms}
.pc-row.enter .pc-city:nth-child(3){animation-delay:110ms}
.pc-row.enter .pc-city:nth-child(4){animation-delay:165ms}
.pc-row.enter .pc-city:nth-child(5){animation-delay:220ms}
.pc-row.enter .pc-city:nth-child(6){animation-delay:275ms}
@keyframes pc-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 여행 완료 ---------- */
.finale{
  margin:26px 0 0;padding:24px 20px;text-align:center;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--card-shadow);
}
.finale .ttl{
  font-family:var(--f-display);font-size:26px;line-height:1.15;
  letter-spacing:-.01em;margin-bottom:8px;
}
.finale .sub{font-size:13px;color:var(--paper-dim)}
.finale .stats{
  display:flex;justify-content:center;gap:26px;margin:20px 0 4px;
}
.finale .stat b{
  display:block;font-family:var(--f-mono);font-size:21px;font-weight:500;
  color:var(--now);letter-spacing:-.01em;
}
.finale .stat span{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--paper-faint);
}
.finale .acts{display:flex;justify-content:center;margin-top:18px}

#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
  padding:10px 16px;border-radius:100px;
  font-size:12.5px;letter-spacing:.01em;
  box-shadow:0 8px 30px -10px var(--scrim);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  z-index:50;max-width:calc(100vw - 40px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  try{ const t = localStorage.getItem(LS_THEME); return (t === 'light' || t === 'dark') ? t : null; }
  catch(e){ return null; }
}
function systemTheme(){ return mql.matches ? 'light' : 'dark'; }
function currentTheme(){ return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; }

function applyTheme(t, persist){
  document.documentElement.dataset.theme = t;
  $('#meta-theme').content = t === 'light' ? '#F7F5F0' : '#12151F';
  $('#theme-toggle').setAttribute('aria-label', t === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환');
  if(persist){
    try{ localStorage.setItem(LS_THEME, t); }catch(e){}
  }
  paintCityColor();
}

  applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
  // 인라인 색이 박힌 블록들이 있어 테마가 바뀌면 다시 그려야 합니다
  if(typeof resetSigs === 'function'){ resetSigs(); render(); }

/* -----------------------------------------------------------
   시간대 — 비행·시차 전환 때 "지금 어느 시간대 기준인지" 알려줍니다
   ----------------------------------------------------------- */
const TZ_ABBR = {
  'Asia/Seoul':'KST', 'Asia/Tokyo':'JST',
  'Europe/Madrid':'CE', 'Europe/Rome':'CE', 'Europe/Prague':'CE',
  'Europe/Zurich':'CE', 'Europe/Paris':'CE', 'Europe/Berlin':'CE',
  'Europe/Vienna':'CE', 'Europe/Amsterdam':'CE', 'Europe/Brussels':'CE',
  'Europe/London':'B',
};

/* 기기 시간대와 서울의 차이(분). 한국에 있으면 0 → 한국시간 병기를 숨깁니다. */
function kstOffsetMin(){
  try{
    const now = new Date();
    const here  = new Date(now.toLocaleString('en-US', { timeZone: tzName() || 'UTC' }));
    const seoul = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
    return Math.round((seoul - here) / 60000);
  }catch(e){ return 0; }
}

/* "16:30" + 오프셋 → { t:"23:30", d:0 }  (d = 날짜 밀림: +1 이면 다음날) */
function toKst(hhmm, offMin){
  const [h, m] = hhmm.split(':').map(Number);
  let x = h * 60 + m + offMin;
  let d = 0;
  while(x < 0){ x += 1440; d -= 1; }
  while(x >= 1440){ x -= 1440; d += 1; }
  return { t: `${pad(Math.floor(x / 60))}:${pad(x % 60)}`, d };
}

function tzName(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch(e){ return ''; }
}

/* 서머타임 중인지 — 1월/7월 오프셋과 비교 */
function isDST(d){
  const y = d.getFullYear();
  const jan = new Date(y, 0, 1).getTimezoneOffset();
  const jul = new Date(y, 6, 1).getTimezoneOffset();
  return d.getTimezoneOffset() < Math.max(jan, jul);
}

function tzAbbr(){
  const d = new Date();
  const zone = tzName();
  const base = TZ_ABBR[zone];
  // CE → CET/CEST, B → GMT/BST 처럼 서머타임에 따라 갈립니다
  if(base === 'CE') return isDST(d) ? 'CEST' : 'CET';
  if(base === 'B')  return isDST(d) ? 'BST'  : 'GMT';
  if(base) return base;

  // 모르는 지역이면 브라우저가 주는 약어, 그것도 없으면 UTC 오프셋
  try{
    const s = new Intl.DateTimeFormat('en-US', { timeZoneName:'short' })
      .formatToParts(d).find(p => p.type === 'timeZoneName').value;
    if(s && !/^(GMT|UTC)[+-]?/.test(s)) return s;
  }catch(e){}
  const off = -d.getTimezoneOffset() / 60;
  return 'UTC' + (off >= 0 ? '+' : '') + (Number.isInteger(off) ? off : off.toFixed(1));
}

/* -----------------------------------------------------------
   날짜 유틸 (로컬 기준 — toISOString 은 UTC라 하루 밀릴 수 있음)
   ----------------------------------------------------------- */
const pad = n => String(n).padStart(2,'0');
function dstr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function today(){ return dstr(new Date()); }
function parseDate(s, time){
  const [y,m,d] = s.split('-').map(Number);
  const [hh,mm] = (time || '00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0, 0);
}
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtDate(s){
  const dt = parseDate(s);
  const w = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${dt.getMonth()+1}월 ${dt.getDate()}일 ${w}요일`;
}
function daysBetween(a, b){ // 날짜 단위 차이 (b - a)
  return Math.round((parseDate(b) - parseDate(a)) / 864e5);
}

/* -----------------------------------------------------------
   데이터 로딩 (fetch → localStorage 캐시 폴백)
   ----------------------------------------------------------- */
const LOAD_TIMEOUT = 5000;

/* 응답이 영영 안 오는 경우가 최악이라 반드시 시간을 끊습니다.
   (이게 없어서 화면이 "불러오는 중"에서 멈추는 문제가 있었습니다)

   abort 만으로는 부족합니다 — signal 을 무시하는 구현이면 그대로 매달리므로
   race 로 확실히 끊고, abort 는 연결을 정리하는 용도로만 씁니다. */
function fetchWithTimeout(url, ms){
  const ac = new AbortController();
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      try{ ac.abort(); }catch(e){}
      const err = new Error('timeout');
      err.name = 'TimeoutError';
      reject(err);
    }, ms);
  });
  const req = fetch(url, { cache: 'no-cache', signal: ac.signal });
  return Promise.race([req, timeout]).finally(() => clearTimeout(timer));
}

/* 형태가 깨진 데이터를 렌더에 넘기면 조용히 죽으므로 여기서 거릅니다 */
function validData(j){
  return !!(j && j.trip && j.trip.start && j.trip.end
    && Array.isArray(j.cities) && j.cities.length
    && Array.isArray(j.days)   && j.days.length
    && j.days.every(d => d.date && Array.isArray(d.items) && d.items.length));
}

function readInlineFallback(){
  const el = document.getElementById('fallback-data');
  if(!el) return null;
  try{
    const j = JSON.parse(el.textContent);
    return validData(j) ? j : null;
  }catch(e){ return null; }
}

/* 네트워크 → localStorage 캐시 → 인라인 백업 순으로 시도합니다.
   반환: { data, source: 'network'|'cache'|'inline'|null, error } */
async function loadData(){
  let error = null;

  try{
    const res = await fetchWithTimeout('./data.json', LOAD_TIMEOUT);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    if(!validData(j)) throw new Error('데이터 형식이 올바르지 않습니다');
    try{ localStorage.setItem(LS_DATA, JSON.stringify(j)); }catch(e){}
    return { data: j, source: 'network', error: null };
  }catch(e){
    error = (e.name === 'TimeoutError' || e.name === 'AbortError')
      ? `응답 없음 (${LOAD_TIMEOUT / 1000}초 초과)`
      : (e.message || String(e));
  }

  try{
    const raw = localStorage.getItem(LS_DATA);
    if(raw){
      const j = JSON.parse(raw);
      if(validData(j)) return { data: j, source: 'cache', error };
    }
  }catch(e){}

  const inline = readInlineFallback();
  if(inline) return { data: inline, source: 'inline', error };

  return { data: null, source: null, error };
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{ // http / 구형 사파리 폴백
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}

function mapQuery(item, city, day){
  if(item.place) return item.place;
  const area = (day && day.map) || (city && city.map);
  return area ? `${item.name}, ${area}` : item.name;
}
