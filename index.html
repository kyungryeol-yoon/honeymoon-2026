<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151F" id="meta-theme">
<meta name="description" content="Kyungryeol & Hojeong · 2026 신혼여행 일정">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Honeymoon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Honeymoon 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* 페인트 전에 테마 확정 — FOUC 방지 */
(function(){
  var t;
  try{ t = localStorage.getItem('hm26-theme'); }catch(e){}
  if(t !== 'light' && t !== 'dark'){
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('#meta-theme');
  if(m) m.content = t === 'light' ? '#F7F5F0' : '#12151F';
})();
</script>
<style>
:root{
  --es:#D4744A;
  --ch:#5B94C4;
  --it:#8AA05A;
  --cz:#B0576B;

  --now:var(--city, #D4744A);

  --f-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"SF Mono",ui-monospace,Menlo,monospace;
}

/* ---------- 다크 (기본) ---------- */
:root,
:root[data-theme="dark"]{
  --ink:#12151F;
  --ink-2:#1A1F2E;
  --ink-3:#252B3D;
  --paper:#F2EFE8;
  --paper-dim:#A8AABA;
  --paper-faint:#5A6076;
  --line:#2E3448;
  --hush:#2E3448;
  --glow:.16;
  --fill-op:.14;
  --card-shadow:none;
  --scrim:rgba(0,0,0,.5);
}

/* ---------- 라이트 ---------- */
:root[data-theme="light"]{
  --ink:#F7F5F0;
  --ink-2:#FFFFFF;
  --ink-3:#F2EEE5;
  --paper:#1A1F2E;
  --paper-dim:#4A5164;
  --paper-faint:#767C8E;
  --line:#E0DCD3;
  --hush:#C9C4B8;
  --glow:.13;
  --fill-op:.13;
  --card-shadow:0 1px 2px rgba(26,31,46,.05), 0 10px 26px -16px rgba(26,31,46,.28);
  --scrim:rgba(26,31,46,.42);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* 히어로 글로우가 좌우로 넘쳐 가로 스크롤이 생기지 않도록 */
html{overflow-x:clip}

body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
  transition:background-color .25s ease,color .25s ease;
}

.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
.hero{
  padding:calc(28px + env(safe-area-inset-top)) 0 22px;
  position:relative;
}
.hero::before{
  content:"";position:absolute;inset:-40% -50% auto;height:420px;
  background:radial-gradient(ellipse at 50% 0%,var(--now) 0%,transparent 62%);
  opacity:var(--glow);pointer-events:none;
}

.eyebrow{
  font-family:var(--f-mono);
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--paper-faint);
  display:flex;align-items:center;gap:7px;
  padding-right:44px;
  min-height:28px;
}
.eyebrow b{color:var(--now);font-weight:500}

/* ---------- 날짜 이동 ---------- */
.nav-btn{
  width:26px;height:26px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:none;border:1px solid transparent;
  color:var(--paper-faint);cursor:pointer;
  font:400 17px/1 var(--f-body);padding:0 0 2px;
  transition:color .15s,border-color .15s;
}
.nav-btn:hover:not(:disabled){color:var(--now);border-color:var(--line)}
.nav-btn:active:not(:disabled){transform:scale(.9)}
.nav-btn:disabled{opacity:.25;cursor:default}
.today-pill{
  font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;
  border:1px solid var(--now);color:var(--now);background:none;
  cursor:pointer;flex:0 0 auto;
}
.today-pill[hidden]{display:none}

/* ---------- 테마 토글 ---------- */
.theme-toggle{
  position:absolute;
  top:calc(22px + env(safe-area-inset-top));
  right:0;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:var(--ink-2);
  border:1px solid var(--line);
  color:var(--paper-dim);
  cursor:pointer;
  transition:color .2s,border-color .2s,background-color .25s;
  z-index:2;
}
.theme-toggle:hover{color:var(--now);border-color:color-mix(in srgb,var(--now) 45%,var(--line))}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle svg{width:17px;height:17px;display:none}
:root[data-theme="dark"] .theme-toggle .i-moon{display:block}
:root[data-theme="light"] .theme-toggle .i-sun{display:block}

/* 화면 꺼짐 방지 — 역·공항에서 편명 띄워놓고 기다릴 때.
   배터리를 먹으므로 자동이 아니라 직접 켜고 끕니다. */
.wake-toggle{right:44px}
.wake-toggle[hidden]{display:none}
.wake-toggle svg{width:17px;height:17px;display:block}
.wake-toggle .i-off{display:block}
.wake-toggle .i-on{display:none}
.wake-toggle.on{color:var(--now);border-color:color-mix(in srgb,var(--now) 55%,var(--line))}
.wake-toggle.on .i-off{display:none}
.wake-toggle.on .i-on{display:block}

/* 도시 랜드마크 아이콘 */
.landmark{
  margin:18px 0 12px;
  height:96px;
  display:flex;align-items:flex-end;
}
.landmark svg{height:100%;width:auto;overflow:visible}
.lm-stroke{fill:none;stroke:var(--now);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lm-fill{fill:var(--now);opacity:var(--fill-op)}
.lm-dim{fill:none;stroke:var(--now);stroke-width:1.2;opacity:.45}

.city-name{
  font-family:var(--f-display);
  font-size:clamp(38px,11vw,52px);
  line-height:.95;
  letter-spacing:-.015em;
  font-weight:400;
}
.city-sub{
  margin-top:10px;
  font-size:13.5px;
  color:var(--paper-dim);
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.city-sub .dot{width:3px;height:3px;border-radius:50%;background:var(--line)}

/* ---------- 여정 라인 (시그니처) ---------- */
.journey{
  margin:26px 0 8px;
  padding:18px 0 4px;
  border-top:1px solid var(--line);
}
.j-track{
  display:flex;align-items:center;
  width:100%;
}
.j-node{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  flex:0 0 auto;position:relative;
  background:none;border:0;padding:2px 4px 0;margin:0;
  font:inherit;color:inherit;cursor:pointer;
}
/* 탭 영역을 점 크기보다 넉넉하게 */
.j-node::after{content:"";position:absolute;inset:-8px -6px -4px}
.j-node:hover .j-label{color:var(--now)}
.j-node:hover .j-dot{border-color:var(--now)}
.j-node:active{transform:scale(.92)}
.j-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--line);
  transition:all .3s;
}
.j-node.done .j-dot{background:var(--paper-faint);border-color:var(--paper-faint)}
.j-node.here .j-dot{
  width:13px;height:13px;
  background:var(--now);border-color:var(--now);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent);
}
.j-label{
  font-family:var(--f-mono);
  font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper-faint);white-space:nowrap;
}
.j-node.here .j-label{color:var(--now)}
.j-seg{flex:1 1 auto;height:1.5px;background:var(--line);margin:0 3px;margin-bottom:22px;border-radius:2px}
.j-seg.done{background:var(--paper-faint)}
.j-seg.pending{
  background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px);
  height:1.5px;
}

.j-meta{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:14px;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--paper-faint);
}
.j-meta b{color:var(--paper-dim);font-weight:500}

/* ---------- NOW 카드 ---------- */
.now-card{
  margin:22px 0 0;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  position:relative;overflow:hidden;
  box-shadow:var(--card-shadow);
}
.now-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--now);
}
.nc-tag{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--now);display:flex;align-items:center;gap:6px;
}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--now);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.nc-title{font-size:19px;font-weight:600;margin:9px 0 3px;letter-spacing:-.01em}
.nc-time{font-family:var(--f-mono);font-size:12px;color:var(--paper-dim)}
.nc-time .rest{color:var(--paper-faint)}

/* 지난 일정 접기 — 밤에 열면 하루의 절반 이상이 이미 끝난 일정입니다 */
.past-fold{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;margin:0 0 16px;padding:9px 12px;
  background:none;border:1px dashed var(--line);border-radius:10px;
  color:var(--paper-faint);font:inherit;font-size:12px;cursor:pointer;
  transition:color .15s,border-color .15s;
}
.past-fold:hover{color:var(--now);border-color:color-mix(in srgb,var(--now) 40%,var(--line))}
.past-fold:active{transform:scale(.99)}
.past-fold svg{width:12px;height:12px;flex:0 0 auto;transition:transform .2s ease}
.past-fold[aria-expanded="true"] svg{transform:rotate(180deg)}
.past-fold[hidden]{display:none}
.nc-next{
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;gap:9px;font-size:13.5px;color:var(--paper-dim);
}
.nc-next .t{font-family:var(--f-mono);font-size:11.5px;color:var(--paper-faint);flex:0 0 auto}
.nc-next[hidden]{display:none}
/* 내일 첫 일정이 이른 새벽이면 자기 전에 확실히 보이도록 */
.nc-next.early{color:var(--now);font-weight:500}
.nc-next.early .t{color:var(--now);font-weight:600}

/* D-day 카운트다운 */
.now-card.countdown .nc-title{
  font-family:var(--f-mono);
  font-size:23px;font-weight:500;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
  margin:11px 0 4px;
}
.dday{
  font-family:var(--f-display);
  font-size:15px;color:var(--now);letter-spacing:.02em;
}

/* ---------- 알림 스트립 ---------- */
.strip{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 0}
.chip{
  font-size:11.5px;padding:6px 11px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
  display:flex;align-items:center;gap:5px;
}
.chip.warn{border-color:color-mix(in srgb,var(--now) 45%,var(--line));color:var(--now)}
/* 오늘 필요한 현금 — 호텔 나서기 전에 보는 값이라 제일 눈에 띄게 */
.chip.cash{
  background:color-mix(in srgb,var(--now) 13%,var(--ink-2));
  border-color:color-mix(in srgb,var(--now) 50%,var(--line));
  color:var(--now);font-weight:600;
}
.chip.cash .amt{font-family:var(--f-mono);letter-spacing:.02em}
.chip.cash svg{width:11px;height:11px;flex:0 0 auto}

/* 오늘 밤 묵는 곳 — 탭하면 주소가 복사됩니다 (택시에서 보여줄 한 줄) */
.chip.stay{
  gap:6px;cursor:pointer;font:inherit;font-size:11.5px;
  color:var(--paper-dim);
  border-style:solid;
}
.chip.stay svg{width:12px;height:12px;flex:0 0 auto;opacity:.75}
.chip.stay:active{border-color:var(--now);color:var(--now)}
.chip.stay.copied{border-color:var(--now);color:var(--now)}
.chip.stay.copied svg{opacity:1}

/* 오프라인 안내 — 지도가 안 열리는 이유를 미리 알려줍니다 */
.netnote{
  margin-top:10px;padding:9px 12px;border-radius:9px;
  font-size:11.5px;line-height:1.55;
  color:var(--paper-dim);
  background:var(--ink-2);border:1px dashed var(--line);
}
.netnote[hidden]{display:none}

/* ---------- 타임라인 ---------- */
section{margin-top:34px}
.sec-head{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--paper-faint);margin-bottom:14px;
  display:flex;align-items:center;gap:10px;
}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line)}

.tl{list-style:none;position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line)}

.tl li{position:relative;padding:0 0 20px}
.tl li::before{
  content:"";position:absolute;left:-22px;top:6px;
  width:9px;height:9px;border-radius:50%;
  background:var(--ink);border:1.5px solid var(--line);
}
.tl li.past{opacity:.42}
.tl li.past::before{background:var(--paper-faint);border-color:var(--paper-faint)}
.tl li.live::before{
  background:var(--now);border-color:var(--now);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 20%,transparent);
}
.tl-t{font-family:var(--f-mono);font-size:11.5px;color:var(--paper-faint);letter-spacing:.04em}
.tl li.live .tl-t{color:var(--now)}
/* 색만으로 현재/지난 일정을 구분하지 않도록 글자도 함께 */
.tl li.live .tl-t::after{content:" · 지금";font-weight:600;letter-spacing:.08em}
.tl-n{font-size:15px;margin-top:2px;font-weight:450}
.tl li.live .tl-n{font-weight:600}
.tl-d{font-size:12.5px;color:var(--paper-faint);margin-top:3px;line-height:1.5}

/* 장소명 → 구글맵 딥링크 */
.map-link{
  color:inherit;text-decoration:none;
  border-bottom:1px dashed color-mix(in srgb,var(--paper-faint) 70%,transparent);
  padding-bottom:1px;
  display:inline-flex;align-items:center;gap:5px;
}
.map-link:active{color:var(--now)}
.pin{width:10px;height:10px;flex:0 0 auto}
.map-link .pin{color:var(--paper-faint);opacity:.8}
.tl li.live .map-link .pin{color:var(--now);opacity:1}

/* 모임 장소 — 투어는 늦으면 끝이라 이름 바로 아래 강조 */
.meet{
  display:flex;align-items:baseline;gap:7px;margin-top:5px;
  font-size:12.5px;color:var(--now);
}
.meet .mt{font-family:var(--f-mono);font-size:11px;flex:0 0 auto;opacity:.9}
.meet a{
  color:inherit;text-decoration:none;
  border-bottom:1px dashed color-mix(in srgb,var(--now) 55%,transparent);
  display:inline-flex;align-items:center;gap:5px;
}
.meet .pin{width:11px;height:11px;color:inherit;opacity:.95}

/* 다음 일정까지의 이동 */
.mv{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;
  color:var(--paper-faint);
}
.mv svg{width:12px;height:12px;flex:0 0 auto;opacity:.7}
/* 시트에 없어 계산해 넣은 소요시간 — 확정값과 구분 */
.mv .est{font-style:normal;opacity:.55}

/* 일정별 준비물 */
.prep{display:flex;align-items:flex-start;gap:6px;margin-top:7px}
.prep .ic{width:11px;height:11px;flex:0 0 auto;color:var(--paper-faint);opacity:.8;margin-top:5px}
.prep .tags{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 auto;min-width:0}
.prep i{
  font-style:normal;font-size:11px;letter-spacing:.01em;line-height:1.45;
  padding:3px 9px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
}
.tl li.live .prep .ic{color:var(--now);opacity:1}
.tl li.live .prep i{border-color:color-mix(in srgb,var(--now) 32%,var(--line))}

/* 예약번호 → 클립보드 복사 */
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ref{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;
  padding:4px 9px;border-radius:7px;
  background:var(--ink-2);border:1px dashed var(--line);
  color:var(--paper-dim);
  display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;
}
.ref:active{border-color:var(--now);color:var(--now)}
.ref .lb{color:var(--paper-faint);font-size:10px}
.ref .cp{width:11px;height:11px;flex:0 0 auto;opacity:.7}
.ref.copied{border-style:solid;border-color:var(--now);color:var(--now)}
/* 가려진 예약번호 — 화면엔 뒤 4자리만, 복사는 원본 */
.ref .masked{letter-spacing:.08em}
.ref.note-only{cursor:default;border-style:dotted}
.ref.note-only .cp{display:none}

/* 바깥 링크 (웹캠 등) */
.exts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ext{
  font-size:11px;letter-spacing:.01em;
  padding:4px 9px;border-radius:100px;
  background:var(--ink-2);border:1px solid var(--line);
  color:var(--paper-dim);text-decoration:none;
  display:inline-flex;align-items:center;gap:6px;
}
.ext:active{border-color:var(--now);color:var(--now)}
.ext .ex{width:10px;height:10px;flex:0 0 auto;opacity:.7}
.tl li.live .ext{border-color:color-mix(in srgb,var(--now) 32%,var(--line))}

/* ---------- 한마디 (현지어 프리셋) ---------- */
.phr{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.phr-row{
  display:flex;align-items:flex-start;gap:10px;width:100%;
  padding:11px 12px;border-radius:10px;text-align:left;
  background:var(--ink-2);border:1px solid var(--line);
  color:inherit;font:inherit;cursor:pointer;
}
.phr-row:active{border-color:var(--now)}
.phr-row.copied{border-color:var(--now)}
.phr-row .ic{width:12px;height:12px;flex:0 0 auto;color:var(--paper-faint);opacity:.8;margin-top:3px}
.phr-row.copied .ic{color:var(--now);opacity:1}
.phr-b{flex:1 1 auto;min-width:0}
.phr-ko{display:block;font-size:11px;color:var(--paper-faint);letter-spacing:.01em}
.phr-x{display:block;font-size:14.5px;margin-top:3px;line-height:1.45}
.phr-r{display:block;font-size:11.5px;color:var(--paper-dim);margin-top:3px;letter-spacing:.01em}
.phr-lang{
  font-size:11px;color:var(--paper-faint);letter-spacing:.02em;
  margin-top:8px;
}

/* ---------- 긴급 연락처 ---------- */
/* tel: 은 네트워크가 없어도 걸립니다 — 오프라인에서도 그대로 동작하는 화면 */
.sos{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sos-row{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:10px;
  background:var(--ink-2);border:1px solid var(--line);
  color:inherit;text-decoration:none;
}
.sos-row:active{border-color:var(--now)}
.sos-row .ic{width:13px;height:13px;flex:0 0 auto;color:var(--paper-faint);opacity:.8}
.sos-b{flex:1 1 auto;min-width:0}
.sos-l{display:block;font-size:12.5px;line-height:1.4}
.sos-n{
  display:block;font-family:var(--f-mono);font-size:11px;
  color:var(--paper-faint);letter-spacing:.03em;margin-top:2px;
}
.sos-t{
  font-family:var(--f-mono);font-size:13.5px;letter-spacing:.02em;
  color:var(--paper-dim);flex:0 0 auto;
}
/* 112 · 144 처럼 바로 거는 번호는 눈에 띄게 */
.sos-row.hot{border-color:color-mix(in srgb,var(--now) 50%,var(--line))}
.sos-row.hot .ic,
.sos-row.hot .sos-t{color:var(--now)}

/* ---------- 접힌 날들 ---------- */
.upcoming{margin-top:10px}
.up-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 2px;border-bottom:1px solid var(--line);
  cursor:pointer;
  width:100%;background:none;border-left:0;border-right:0;border-top:0;
  color:inherit;font:inherit;text-align:left;
}
.up-row:first-child{border-top:1px solid var(--line)}
.up-date{font-family:var(--f-mono);font-size:11px;color:var(--paper-faint);flex:0 0 46px;letter-spacing:.04em}
.up-city{font-size:14px;flex:1}
.up-bar{width:3px;height:26px;border-radius:2px;background:var(--c,var(--line));flex:0 0 auto}
.up-arrow{color:var(--paper-faint);font-size:15px}
.up-row:active .up-arrow{color:var(--now)}
.up-cash{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;
  color:var(--c,var(--paper-faint));flex:0 0 auto;
}

footer{
  margin:44px 0 30px;text-align:center;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  color:var(--hush);text-transform:uppercase;
}

/* 스크린리더 전용 — 색으로만 구분되지 않게 텍스트를 함께 넣습니다 */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ---------- 상태 / 토스트 ---------- */
.state{
  margin:40px 0;text-align:center;color:var(--paper-faint);
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;
}
.offline-note{
  margin-top:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--paper-faint);
}

/* ---------- 로딩 실패 화면 ---------- */
.errbox{
  margin:26px 0 0;padding:20px;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid color-mix(in srgb,var(--now) 40%,var(--line));
  border-radius:14px;box-shadow:var(--card-shadow);
}
.errbox h2{
  font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:7px;
}
.errbox p{font-size:13px;color:var(--paper-dim);line-height:1.65}
.errbox .why{
  margin-top:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;
  color:var(--paper-faint);word-break:break-all;
}
.errbox .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{
  font:inherit;font-size:13px;font-weight:500;
  padding:9px 16px;border-radius:100px;cursor:pointer;
  background:var(--now);border:1px solid var(--now);color:var(--ink);
}
.btn.ghost{background:none;color:var(--paper-dim);border-color:var(--line)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}

/* 네트워크 대신 캐시·백업으로 뜬 경우 알림 */
.src-note{
  display:flex;align-items:center;gap:7px;
  margin:14px 0 0;padding:9px 13px;border-radius:10px;
  background:var(--ink-2);border:1px dashed var(--line);
  font-size:11.5px;color:var(--paper-dim);
}
.src-note button{
  margin-left:auto;font:inherit;font-size:11px;background:none;border:0;
  color:var(--now);cursor:pointer;padding:2px 4px;flex:0 0 auto;
}
.src-note[hidden]{display:none}

/* ---------- 오늘로 이동 (플로팅) ---------- */
#to-today{
  position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:6px;
  padding:11px 16px;border-radius:100px;
  background:var(--now);border:0;color:var(--ink);
  font:inherit;font-size:13px;font-weight:600;
  box-shadow:0 6px 22px -6px var(--scrim);
  cursor:pointer;z-index:40;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
#to-today.show{opacity:1;transform:none;pointer-events:auto}
#to-today svg{width:13px;height:13px}

/* ---------- 여행 완료 ---------- */
.finale{
  margin:26px 0 0;padding:24px 20px;text-align:center;
  background:linear-gradient(160deg,var(--ink-2),var(--ink-3));
  border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--card-shadow);
}
.finale .ttl{
  font-family:var(--f-display);font-size:26px;line-height:1.15;
  letter-spacing:-.01em;margin-bottom:8px;
}
.finale .sub{font-size:13px;color:var(--paper-dim)}
.finale .stats{
  display:flex;justify-content:center;gap:26px;margin:20px 0 4px;
}
.finale .stat b{
  display:block;font-family:var(--f-mono);font-size:21px;font-weight:500;
  color:var(--now);letter-spacing:-.01em;
}
.finale .stat span{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--paper-faint);
}
.finale .acts{display:flex;justify-content:center;margin-top:18px}

#toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,14px);
  background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
  padding:10px 16px;border-radius:100px;
  font-size:12.5px;letter-spacing:.01em;
  box-shadow:0 8px 30px -10px var(--scrim);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  z-index:50;max-width:calc(100vw - 40px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ===========================================================
   Honeymoon 2026 — PWA
   데이터는 data.json 에서 불러옵니다.
   =========================================================== */

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const LS_THEME = 'hm26-theme';
const LS_DATA  = 'hm26-data';

/* 현재 헤더에 표시 중인 도시 — 테마가 바뀌면 도시 색도 같이 바뀝니다 */
let activeCity = null;

/* -----------------------------------------------------------
   테마
   ----------------------------------------------------------- */
const mql = window.matchMedia('(prefers-color-scheme: light)');

function storedTheme(){
  try{ const t = localStorage.getItem(LS_THEME); return (t === 'light' || t === 'dark') ? t : null; }
  catch(e){ return null; }
}
function systemTheme(){ return mql.matches ? 'light' : 'dark'; }
function currentTheme(){ return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; }

function applyTheme(t, persist){
  document.documentElement.dataset.theme = t;
  $('#meta-theme').content = t === 'light' ? '#F7F5F0' : '#12151F';
  $('#theme-toggle').setAttribute('aria-label', t === 'light' ? '다크 모드로 전환' : '라이트 모드로 전환');
  if(persist){
    try{ localStorage.setItem(LS_THEME, t); }catch(e){}
  }
  paintCityColor();
}

$('#theme-toggle').addEventListener('click', () => {
  applyTheme(currentTheme() === 'light' ? 'dark' : 'light', true);
});

/* 사용자가 직접 고른 적 없으면 시스템 설정을 계속 따라감 */
mql.addEventListener('change', () => { if(!storedTheme()) applyTheme(systemTheme(), false); });

applyTheme(storedTheme() || systemTheme(), false);

/* -----------------------------------------------------------
   화면 꺼짐 방지 — 역·공항에서 편명 띄워놓고 기다릴 때.
   배터리를 먹으므로 자동이 아니라 직접 켜고 끕니다.
   새로고침하면 꺼진 상태로 돌아갑니다 (켜둔 걸 잊고 방전되는 게 더 나쁨).
   ----------------------------------------------------------- */
const wakeBtn = $('#wake-toggle');
let wakeLock = null, wakeWanted = false;

if('wakeLock' in navigator) wakeBtn.hidden = false;

function paintWake(){
  wakeBtn.classList.toggle('on', wakeWanted);
  wakeBtn.setAttribute('aria-pressed', wakeWanted ? 'true' : 'false');
}

async function acquireWake(){
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    // 화면이 실제로 꺼지거나 앱이 가려지면 브라우저가 알아서 풀어버립니다
    wakeLock.addEventListener('release', () => { wakeLock = null; });
    return true;
  }catch(e){ wakeLock = null; return false; }
}

wakeBtn.addEventListener('click', async () => {
  if(wakeWanted){
    wakeWanted = false;
    if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
    paintWake();
    toast('화면 꺼짐 방지 해제');
    return;
  }
  if(await acquireWake()){
    wakeWanted = true;
    paintWake();
    toast('화면을 켜 둡니다 · 배터리 주의');
  }else{
    toast('이 기기에서는 화면 유지가 안 됩니다');
  }
});

// 잠깐 다른 앱 갔다 오면 브라우저가 풀어놓으므로 다시 겁니다
document.addEventListener('visibilitychange', () => {
  if(wakeWanted && !wakeLock && document.visibilityState === 'visible') acquireWake();
});

/* -----------------------------------------------------------
   시간대 — 비행·시차 전환 때 "지금 어느 시간대 기준인지" 알려줍니다
   ----------------------------------------------------------- */
const TZ_ABBR = {
  'Asia/Seoul':'KST', 'Asia/Tokyo':'JST',
  'Europe/Madrid':'CE', 'Europe/Rome':'CE', 'Europe/Prague':'CE',
  'Europe/Zurich':'CE', 'Europe/Paris':'CE', 'Europe/Berlin':'CE',
  'Europe/Vienna':'CE', 'Europe/Amsterdam':'CE', 'Europe/Brussels':'CE',
  'Europe/London':'B',
};

function tzName(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch(e){ return ''; }
}

/* 서머타임 중인지 — 1월/7월 오프셋과 비교 */
function isDST(d){
  const y = d.getFullYear();
  const jan = new Date(y, 0, 1).getTimezoneOffset();
  const jul = new Date(y, 6, 1).getTimezoneOffset();
  return d.getTimezoneOffset() < Math.max(jan, jul);
}

function tzAbbr(){
  const d = new Date();
  const zone = tzName();
  const base = TZ_ABBR[zone];
  // CE → CET/CEST, B → GMT/BST 처럼 서머타임에 따라 갈립니다
  if(base === 'CE') return isDST(d) ? 'CEST' : 'CET';
  if(base === 'B')  return isDST(d) ? 'BST'  : 'GMT';
  if(base) return base;

  // 모르는 지역이면 브라우저가 주는 약어, 그것도 없으면 UTC 오프셋
  try{
    const s = new Intl.DateTimeFormat('en-US', { timeZoneName:'short' })
      .formatToParts(d).find(p => p.type === 'timeZoneName').value;
    if(s && !/^(GMT|UTC)[+-]?/.test(s)) return s;
  }catch(e){}
  const off = -d.getTimezoneOffset() / 60;
  return 'UTC' + (off >= 0 ? '+' : '') + (Number.isInteger(off) ? off : off.toFixed(1));
}

/* -----------------------------------------------------------
   날짜 유틸 (로컬 기준 — toISOString 은 UTC라 하루 밀릴 수 있음)
   ----------------------------------------------------------- */
const pad = n => String(n).padStart(2,'0');
function dstr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function today(){ return dstr(new Date()); }
function parseDate(s, time){
  const [y,m,d] = s.split('-').map(Number);
  const [hh,mm] = (time || '00:00').split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0, 0);
}
function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function fmtDate(s){
  const dt = parseDate(s);
  const w = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${dt.getMonth()+1}월 ${dt.getDate()}일 ${w}요일`;
}
function daysBetween(a, b){ // 날짜 단위 차이 (b - a)
  return Math.round((parseDate(b) - parseDate(a)) / 864e5);
}

/* -----------------------------------------------------------
   데이터 로딩 (fetch → localStorage 캐시 폴백)
   ----------------------------------------------------------- */
const LOAD_TIMEOUT = 5000;

/* 응답이 영영 안 오는 경우가 최악이라 반드시 시간을 끊습니다.
   (이게 없어서 화면이 "불러오는 중"에서 멈추는 문제가 있었습니다)

   abort 만으로는 부족합니다 — signal 을 무시하는 구현이면 그대로 매달리므로
   race 로 확실히 끊고, abort 는 연결을 정리하는 용도로만 씁니다. */
function fetchWithTimeout(url, ms){
  const ac = new AbortController();
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      try{ ac.abort(); }catch(e){}
      const err = new Error('timeout');
      err.name = 'TimeoutError';
      reject(err);
    }, ms);
  });
  const req = fetch(url, { cache: 'no-cache', signal: ac.signal });
  return Promise.race([req, timeout]).finally(() => clearTimeout(timer));
}

/* 형태가 깨진 데이터를 렌더에 넘기면 조용히 죽으므로 여기서 거릅니다 */
function validData(j){
  return !!(j && j.trip && j.trip.start && j.trip.end
    && Array.isArray(j.cities) && j.cities.length
    && Array.isArray(j.days)   && j.days.length
    && j.days.every(d => d.date && Array.isArray(d.items) && d.items.length));
}

function readInlineFallback(){
  const el = document.getElementById('fallback-data');
  if(!el) return null;
  try{
    const j = JSON.parse(el.textContent);
    return validData(j) ? j : null;
  }catch(e){ return null; }
}

/* 네트워크 → localStorage 캐시 → 인라인 백업 순으로 시도합니다.
   반환: { data, source: 'network'|'cache'|'inline'|null, error } */
async function loadData(){
  let error = null;

  try{
    const res = await fetchWithTimeout('./data.json', LOAD_TIMEOUT);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    if(!validData(j)) throw new Error('데이터 형식이 올바르지 않습니다');
    try{ localStorage.setItem(LS_DATA, JSON.stringify(j)); }catch(e){}
    return { data: j, source: 'network', error: null };
  }catch(e){
    error = (e.name === 'TimeoutError' || e.name === 'AbortError')
      ? `응답 없음 (${LOAD_TIMEOUT / 1000}초 초과)`
      : (e.message || String(e));
  }

  try{
    const raw = localStorage.getItem(LS_DATA);
    if(raw){
      const j = JSON.parse(raw);
      if(validData(j)) return { data: j, source: 'cache', error };
    }
  }catch(e){}

  const inline = readInlineFallback();
  if(inline) return { data: inline, source: 'inline', error };

  return { data: null, source: null, error };
}

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{ // http / 구형 사파리 폴백
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){ return false; }
  }
}

function mapHref(query){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}
// place 를 적었으면 그대로 검색합니다 (이동일엔 하루 안에 도시가 두 개라
// 도시명을 덧붙이면 오히려 엉뚱한 곳이 나옵니다). place 가 없을 때만
// 그날의 거점(day.map) 또는 도시 기본값을 붙입니다.
function mapQuery(item, city, day){
  if(item.place) return item.place;
  const area = (day && day.map) || (city && city.map);
  return area ? `${item.name}, ${area}` : item.name;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let TRIP = null, CITIES = [], DAYS = [], TOTAL_DAYS = 0, DATA_SOURCE = null;
let PHRASES = {};   // 현지어 프리셋 — 없어도 화면은 그대로 돕니다

const cityById = id => CITIES.find(c => c.id === id) || CITIES[0];

function cityColor(c){
  if(!c) return '#D4744A';
  return currentTheme() === 'light' ? (c.colorLight || c.color) : c.color;
}
function paintCityColor(){
  if(activeCity) document.documentElement.style.setProperty('--city', cityColor(activeCity));
}

/* 여행 전 / 중 / 후 */
function phase(){
  const t = today();
  if(t < TRIP.start) return 'pre';
  if(t > TRIP.end)   return 'post';
  return 'live';
}

function pickDay(){
  const t = today();
  const exact = DAYS.find(d => d.date === t);
  if(exact) return exact;
  const upcoming = DAYS.find(d => d.date > t);
  if(upcoming) return upcoming;
  return DAYS[DAYS.length - 1];
}

/* 사용자가 화살표/스와이프로 넘겨본 날. null 이면 오늘(자동) */
let viewDate = null;

function autoDay(){ return phase() === 'pre' ? DAYS[0] : pickDay(); }
function currentDay(){
  return (viewDate && DAYS.find(d => d.date === viewDate)) || autoDay();
}
function stepDay(delta){
  const i = DAYS.findIndex(d => d.date === currentDay().date);
  const next = DAYS[i + delta];
  if(!next) return;
  viewDate = next.date;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function goToday(){
  viewDate = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* 오늘 기준 상대 표현 — "내일 일정 미리보기"가 이 앱의 핵심 용도 */
function relLabel(date){
  const diff = daysBetween(today(), date);
  if(diff === 0) return '오늘';
  if(diff === 1) return '내일';
  if(diff === 2) return '모레';
  if(diff === -1) return '어제';
  return null;
}

/* -----------------------------------------------------------
   타임라인 아이템 렌더
   ----------------------------------------------------------- */
function itemHTML(it, city, cls, day, next){
  const time = `${it.time}${it.end ? ' – ' + it.end : ''}`;
  const mappable = it.map !== false && (it.place || it.name);
  const name = mappable
    ? `<a class="map-link" href="${esc(mapHref(mapQuery(it, city, day)))}" target="_blank" rel="noopener noreferrer">${esc(it.name)}${PIN}</a>`
    : esc(it.name);

  // 모임 장소 — 지도로 바로 갈 수 있어야 의미가 있음
  const m = it.meet;
  // 미팅 시각이 일정 시각과 같으면 위에 이미 떠 있으므로 생략
  const mTime = m && m.time && m.time !== it.time ? m.time : null;
  const meet = m ? `<div class="meet">
      ${mTime ? `<span class="mt">${esc(mTime)}</span>` : ''}
      <a href="${esc(mapHref(m.place || mapQuery(it, city, day)))}" target="_blank" rel="noopener noreferrer">${PIN}${esc(m.where)}</a>
    </div>` : '';

  // 다음 일정까지 어떻게 가는지 — 블록 맨 아래에 붙여 이어지게.
  // "(추정)" 은 시트에 없어서 계산해 넣은 값이라 흐리게 구분합니다.
  const mv = next && next.move
    ? `<div class="mv">${ARROW}${esc(next.move).replace(
        /\(추정\)/, '<em class="est">(추정)</em>')}</div>`
    : '';

  const refs = (it.refs || []).map(r => {
    const lb = r.label ? `<span class="lb">${esc(r.label)}</span>` : '';
    // 값 없이 안내만 (예: "메일 확인") — 복사할 게 없으므로 버튼이 아닌 표시용
    if(!r.value){
      return `<span class="ref note-only">${lb}<span>${esc(r.note || '확인 필요')}</span></span>`;
    }
    // mask:true — 화면엔 뒤 4자리만, 복사는 원본. 자릿수도 드러내지 않습니다
    const shown = r.mask
      ? `<span class="masked">${'•'.repeat(6)}${esc(String(r.value).slice(-4))}</span>`
      : `<span>${esc(r.value)}</span>`;
    const aria = r.mask
      ? `${r.label || '값'} 복사 (가려진 값)`
      : `${r.label || '값'} ${r.value} 복사`;
    return `<button type="button" class="ref" data-copy="${esc(r.value)}" aria-label="${esc(aria)}">
       ${lb}${shown}${CP}
     </button>`;
  }).join('');

  const prep = (it.prep || []).length
    ? `<div class="prep">${CK}<span class="tags">${it.prep.map(p => `<i>${esc(p)}</i>`).join('')}</span></div>`
    : '';

  // 바깥 링크 (웹캠·운행상황 등). http(s) 만 — javascript: 같은 스킴은 버립니다
  const links = (it.links || [])
    .filter(l => l && l.url && /^https?:\/\//i.test(l.url))
    .map(l => `<a class="ext" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label || l.url)}${EXT}</a>`)
    .join('');

  // 흐리게 처리한 지난 일정도 스크린리더가 알 수 있게
  const srState = cls === 'past' ? '<span class="sr-only">지난 일정. </span>'
                : cls === 'live' ? '<span class="sr-only">진행 중. </span>' : '';

  return `<li class="${cls}">
    ${srState}
    <div class="tl-t">${esc(time)}</div>
    <div class="tl-n">${name}</div>
    ${meet}
    ${it.desc ? `<div class="tl-d">${esc(it.desc)}</div>` : ''}
    ${prep}
    ${refs ? `<div class="refs">${refs}</div>` : ''}
    ${links ? `<div class="exts">${links}</div>` : ''}
    ${mv}
  </li>`;
}

/* -----------------------------------------------------------
   렌더
   ----------------------------------------------------------- */
function render(){
  if(!DAYS.length) return;

  const ph   = phase();
  const day  = ph === 'pre' && !viewDate ? DAYS[0] : currentDay();
  const city = cityById(day.city);
  const now  = new Date();
  /* 기기 로컬 시간 기준입니다 — data.json 의 시각은 그날 현지 시각이므로
     현지에서는 정확하지만, 시간대를 넘는 순간에는 어긋납니다.

     9/14 비행 중 기기가 KST → CEST 로 자동 전환되면 그 순간 NOW 카드가
     7시간 점프합니다. 그래도 로직은 로컬 시간 그대로 둡니다 —
     나머지 20일은 이 방식이 정확하고, 9/14 는 이동만 있는 날이라
     실용상 문제가 없습니다. (9/14 항목에는 시각의 기준 시간대를 적어뒀습니다)
     날짜 판정(today())도 같은 기준이라 둘이 어긋나지 않습니다. */
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = day.date === today();
  const browsing = !isToday;        // 오늘이 아닌 날을 넘겨보는 중
  const rel = relLabel(day.date);
  const finished = ph === 'post' && !viewDate;   // 여행 종료 요약 화면

  activeCity = (ph === 'pre' && !viewDate) ? CITIES[0] : city;
  paintCityColor();

  const headCity = activeCity;

  /* ---- 날짜 이동 버튼 ---- */
  const di = DAYS.findIndex(d => d.date === day.date);
  $('#day-prev').disabled = di <= 0;
  $('#day-next').disabled = di >= DAYS.length - 1;
  $('#today-pill').hidden = !(browsing && ph === 'live');

  /* ---- 헤더 ---- */
  $('#clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const tzEl = $('#tz');
  tzEl.textContent = tzAbbr();
  tzEl.title = tzName();
  $('#landmark').innerHTML = ICONS[headCity.icon] || '';
  // 스위스처럼 한 노드 안에서 거점이 바뀌는 날은 day.label 로 실제 지명을 보여줍니다
  $('#city-name').textContent = (ph !== 'pre' && day.label) ? day.label : headCity.name;
  $('#ey-flag').textContent = headCity.flag;

  const dLeft = daysBetween(today(), TRIP.start);

  if(finished){
    $('#ey-date').textContent = '여행 완료';
    $('#day-count').textContent = `${TOTAL_DAYS}일 완주`;
    $('#left').textContent = TRIP.end.replace(/-/g, '.');
  }else if(ph === 'pre' && !viewDate){
    $('#ey-date').textContent = `${fmtDate(TRIP.start)} 출발`;
    $('#day-count').textContent = dLeft === 0 ? '오늘 출발' : `D-${dLeft}`;
    $('#left').textContent = `${TOTAL_DAYS}일간의 여정`;
  }else if(browsing){
    $('#ey-date').textContent = (rel ? rel + ' · ' : '') + fmtDate(day.date);
    $('#day-count').textContent = `여행 ${day.dayNo}일차`;
    $('#left').textContent = `${day.items.length}개 일정`;
  }else if(ph === 'post'){
    $('#ey-date').textContent = fmtDate(TRIP.end);
    $('#day-count').textContent = `여행 ${TOTAL_DAYS}일 완주`;
    $('#left').textContent = '집으로';
  }else{
    $('#ey-date').textContent = fmtDate(day.date);
    $('#day-count').textContent = `여행 ${day.dayNo}일차`;
    const leftDays = Math.max(0, daysBetween(today(), TRIP.end));
    $('#left').textContent = leftDays > 0 ? `${leftDays}일 남음` : '마지막 날';
  }

  /* ---- 여정 라인 (완주하면 전부 done) ---- */
  const hereIdx = finished
    ? CITIES.length
    : ((ph === 'pre' && !viewDate) ? -1 : CITIES.findIndex(c => c.id === city.id));
  const track = $('#j-track');
  track.innerHTML = '';
  CITIES.forEach((c,i) => {
    if(i > 0){
      const seg = document.createElement('div');
      seg.className = 'j-seg ' + (i <= hereIdx ? 'done' : 'pending');
      track.appendChild(seg);
    }
    // 도시 노드를 눌러 그 도시 첫날로 이동
    const node = document.createElement('button');
    node.type = 'button';
    node.className = 'j-node ' + (i < hereIdx ? 'done' : i === hereIdx ? 'here' : '');
    node.dataset.city = c.id;
    node.setAttribute('aria-label', `${c.name}로 이동`);
    node.innerHTML = `<span class="j-dot"></span><span class="j-label">${esc(c.short)}</span>`;
    track.appendChild(node);
  });
  /* 위 여정 라인이 이미 전체 경로를 보여주므로, 이 줄은 "직전에 있던 곳 → 지금 →
     다음 목적지"로 현재 위치를 알려주는 데 씁니다. 양옆이 늘 Seoul 이면 매일
     같은 문장이라 알려주는 게 없습니다. */
  const preHead = ph === 'pre' && !viewDate;
  const curIdx  = preHead ? 0 : Math.max(0, CITIES.findIndex(c => c.id === city.id));
  const prevName = curIdx > 0 ? CITIES[curIdx - 1].name : 'Seoul';
  const nextName = curIdx < CITIES.length - 1 ? CITIES[curIdx + 1].name : null;
  $('#j-route').innerHTML = nextName
    ? `${esc(prevName)} → <b>${esc(CITIES[curIdx].name)}</b> → ${esc(nextName)}`
    : `${esc(prevName)} → <b>${esc(CITIES[curIdx].name)}</b> · 완주`;
  $('#j-prog').textContent = preHead ? 0 : (ph === 'post' && !viewDate ? TOTAL_DAYS : day.dayNo);
  $('#j-total').textContent = TOTAL_DAYS;

  /* ---- 칩 (숙소·현금이 맨 앞) ---- */
  const strip = $('#strip');
  strip.innerHTML = '';
  // 체크인한 날에만 뜨고 다음 날 사라지던 숙소를 매일 고정합니다.
  // 밤늦게 택시에서 보여줄 한 줄이라 탭하면 주소가 복사됩니다.
  if(!finished && day.stay){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'chip stay';
    el.dataset.copy = day.stay.addr || day.stay.place || day.stay.name;
    el.innerHTML = `${BED}<span>${esc(day.stay.name)}</span>`;
    el.title = el.dataset.copy;
    el.setAttribute('aria-label', `오늘 숙소 ${day.stay.name} · 주소 복사`);
    strip.appendChild(el);
  }
  if(!finished && day.cash){
    const el = document.createElement('span');
    el.className = 'chip cash';
    el.innerHTML = `${COIN}<span class="amt">${esc(day.cash.amount)}</span>` +
                   (day.cash.note ? ` <span>· ${esc(day.cash.note)}</span>` : '');
    if(day.cash.for) el.title = day.cash.for;
    strip.appendChild(el);
  }
  (finished ? [] : (day.chips || [])).forEach(c => {
    const el = document.createElement('span');
    el.className = 'chip' + (c.warn ? ' warn' : '');
    el.textContent = c.t;
    strip.appendChild(el);
  });

  /* ---- 현재 / 다음 판별 ---- */
  let liveIdx = -1, nextIdx = -1;
  // 첫 일정 시작 전인가 — 이때 "지금"이라고 하면 거짓말이 됩니다
  let beforeStart = false;
  if(isToday && ph === 'live'){
    day.items.forEach((it,i) => {
      const s = toMin(it.time);
      const e = it.end ? toMin(it.end) : (day.items[i+1] ? toMin(day.items[i+1].time) : 1440);
      if(nowMin >= s && nowMin < e) liveIdx = i;
      if(nextIdx === -1 && s > nowMin) nextIdx = i;
    });
    if(liveIdx === -1 && nextIdx === -1) liveIdx = day.items.length - 1;
    beforeStart = nowMin < toMin(day.items[0].time);
    // 시작 전에는 첫 일정이 "지금"이자 "다음"으로 겹치므로 다음은 두 번째 일정으로
    if(beforeStart && nextIdx === 0) nextIdx = day.items.length > 1 ? 1 : -1;
  }

  /* ---- 여행 완료 요약 ---- */
  $('#finale').hidden = !finished;
  $('#now-card').hidden = finished;
  if(finished){
    // cities 는 7개지만 서울(home)은 출발·귀국지라 "방문한 도시"에서 뺍니다 → 6
    const visited = CITIES.filter(c => !c.home).length;
    $('#fin-title').textContent = `${TOTAL_DAYS}일의 여정이 끝났습니다`;
    $('#fin-sub').textContent =
      `${fmtDate(TRIP.start)} – ${fmtDate(TRIP.end)} · ${TRIP.couple}`;
    $('#fin-days').textContent   = TOTAL_DAYS;
    $('#fin-cities').textContent = visited;
    $('#fin-items').textContent  = DAYS.reduce((n,d) => n + d.items.length, 0);
  }

  /* ---- NOW 카드 ---- */
  const card = $('#now-card');
  $('#nc-next').classList.remove('early');
  const hasFirstDay = DAYS[0].date === TRIP.start;

  if(finished){
    countdownTarget = null;
  }else if(ph === 'pre' && !viewDate){
    card.classList.add('countdown');
    countdownTarget = parseDate(TRIP.start, hasFirstDay ? DAYS[0].items[0].time : '00:00');
    $('#nc-tag-label').textContent = '출발까지';
    tickCountdown();
    $('#now-time').innerHTML = `<span class="dday">${TRIP.start.replace(/-/g,'.')}</span> · ${esc(CITIES[0].name)}에서 시작`;
    // 1일차 일정이 아직 등록되지 않았으면 "첫 일정" 이라고 말하지 않음
    $('#nc-next').hidden = !hasFirstDay;
    if(hasFirstDay){
      const first = DAYS[0].items[0];
      $('#next-time').textContent = first.time;
      $('#next-name').textContent = `첫 일정 · ${first.name}`;
    }
  }else if(browsing){
    /* 다른 날을 미리 볼 때 — 몇 시에 시작해서 몇 시에 끝나는지, 미팅은 언제인지 */
    card.classList.remove('countdown');
    countdownTarget = null;

    const first = day.items[0];
    const last  = day.items[day.items.length - 1];
    const meetItem = day.items.find(i => i.meet);

    $('#nc-tag-label').textContent = rel || fmtDate(day.date);
    $('#now-title').textContent = `${first.time} ${first.name}`;
    $('#now-time').textContent  = `일정 ${day.items.length}개 · 마지막 ${last.time} ${last.name}`;

    $('#nc-next').hidden = false;
    if(meetItem){
      $('#next-time').textContent = meetItem.meet.time || meetItem.time;
      $('#next-name').textContent = `미팅 · ${meetItem.meet.where}`;
    }else if(day.cash){
      $('#next-time').textContent = '현금';
      $('#next-name').textContent = day.cash.for
        ? `${day.cash.amount} · ${day.cash.for}` : day.cash.amount;
    }else{
      $('#next-time').textContent = '';
      $('#next-name').textContent = day.label || cityById(day.city).name;
    }
  }else{
    card.classList.remove('countdown');
    countdownTarget = null;
    $('#nc-tag-label').textContent =
      ph === 'post' ? '여행 종료' : (beforeStart ? '곧 시작' : '지금');

    const live = day.items[liveIdx] || day.items[0];
    $('#now-title').textContent = live.name;

    // 시각 옆에 남은 일정 — 밤에 페이스를 가늠할 수 있게
    const timeTxt = live.end ? `${live.time} – ${live.end}` : live.time;
    const restN = (isToday && ph === 'live' && liveIdx > -1)
      ? day.items.length - 1 - liveIdx : 0;
    $('#now-time').innerHTML = restN > 0
      ? `${esc(timeTxt)} <span class="rest">· 남은 일정 ${restN}개 · 마지막 ${esc(day.items[day.items.length-1].time)}</span>`
      : esc(timeTxt);

    const nxt = day.items[nextIdx];
    $('#nc-next').hidden = false;
    if(nxt){
      $('#next-time').textContent = nxt.time;
      $('#next-name').textContent = nxt.desc ? `${nxt.name} · ${nxt.desc}` : nxt.name;
    }else if(ph === 'post'){
      $('#next-time').textContent = '';
      $('#next-name').textContent = '모든 일정 완료';
    }else{
      /* 오늘이 끝났으면 내일 첫 일정을 보여줍니다.
         자기 전 마지막으로 보는 화면인데 "내일 몇 시에 일어나야 하는지"가
         없으면 곤란합니다 — 9/17 은 02:30 기상, 9/27 은 06:45 투어 미팅입니다. */
      const tmr = DAYS[DAYS.findIndex(d => d.date === day.date) + 1];
      if(isToday && tmr){
        const first = tmr.items[0];
        $('#next-time').textContent = `내일 ${first.time}`;
        $('#next-name').textContent = first.desc ? `${first.name} · ${first.desc}` : first.name;
        // 이른 시각이면 눈에 띄게
        $('#nc-next').classList.toggle('early', toMin(first.time) < 7 * 60);
      }else{
        $('#next-time').textContent = '';
        $('#next-name').textContent = '오늘 일정 끝';
      }
    }
  }

  /* ---- 타임라인 ---- */
  $('#sec-today').hidden = finished;
  $('#tl').setAttribute('aria-label',
    isToday ? '오늘 일정' : `${fmtDate(day.date)} 일정`);
  $('#head-today').textContent = (ph === 'pre' && !viewDate)
    ? (hasFirstDay ? '첫날 일정' : `${fmtDate(day.date)} · 미리보기`)
    : (isToday ? '오늘' : (rel ? `${rel} 일정` : fmtDate(day.date)));
  /* 지난 일정 접기 — 9/26 밤이면 18개 중 17개가 이미 끝난 일정이라
     화면 위쪽 2천 픽셀이 죽은 정보가 됩니다. 날이 바뀌면 다시 접힙니다. */
  const foldable = isToday && ph === 'live' && liveIdx > 0;
  if(showPastFor !== day.date){ showPastFor = day.date; showPast = false; }
  const fold = $('#past-fold');
  fold.hidden = !foldable;
  if(foldable){
    fold.setAttribute('aria-expanded', String(showPast));
    fold.innerHTML = CHEV + (showPast ? '지난 일정 접기' : `지난 일정 ${liveIdx}개 보기`);
  }
  const fromIdx = (foldable && !showPast) ? liveIdx : 0;

  $('#tl').innerHTML = day.items
    .map((it,i) => [it,i])
    .filter(([,i]) => i >= fromIdx)
    .map(([it,i]) => itemHTML(
      it, city,
      i === liveIdx ? 'live' : (liveIdx > -1 && i < liveIdx ? 'past' : ''),
      day, day.items[i+1]))
    .join('');

  /* 하루 15~29개라 오후에 열면 항상 손으로 내려야 했습니다.
     그 날에 처음 들어올 때 한 번만 "지금" 일정으로 옮겨줍니다 —
     매 렌더마다 하면 사용자가 스크롤하는 걸 앱이 도로 끌어당깁니다. */
  if(liveIdx > 0 && scrolledDate !== day.date){
    scrolledDate = day.date;
    const live = $('#tl').children[liveIdx];
    if(live) requestAnimationFrame(() => live.scrollIntoView({
      block: 'center',
      behavior: reduceMotion.matches ? 'auto' : 'smooth',
    }));
  }

  /* ---- 한마디 — 그날 도시의 언어만 ----
     영어가 막히는 자리에서 화면을 그대로 보여주면 되게 만든 것입니다.
     탭하면 현지어 문장이 복사됩니다. */
  renderPhrases(finished ? null : city);
  renderSOS(finished ? null : city);
  paintNet();

  /* ---- 이후 날들 — 탭하면 그 날로 이동 ---- */
  const up = $('#upcoming');
  const rest = finished ? [] : DAYS.filter(d => d.date > day.date);
  $('#sec-upcoming').hidden = rest.length === 0;
  $('#head-upcoming').textContent = `이후 ${rest.length}일`;
  up.innerHTML = rest.map(d => {
    const c = cityById(d.city);
    const md = d.date.slice(5).replace('-','/');
    // 그날을 대표하는 일정: 투어 미팅 → 가장 오래 잡힌 활동 → 장소가 있는 일정 순
    const longest = d.items
      .filter(i => i.end)
      .sort((a,b) => (toMin(b.end) - toMin(b.time)) - (toMin(a.end) - toMin(a.time)))[0];
    const label = d.label
      || d.items.find(i => i.meet)?.name
      || longest?.name
      || d.items.find(i => i.place)?.name
      || d.items[0].name;
    const r = relLabel(d.date);
    return `<button class="up-row" type="button" data-date="${d.date}">
        <span class="up-bar" style="--c:${cityColor(c)}"></span>
        <span class="up-date">${r || md}</span>
        <span class="up-city">${esc(c.name)} · ${esc(label)}</span>
        ${d.cash ? `<span class="up-cash" style="--c:${cityColor(c)}">${esc(d.cash.amount)}</span>` : ''}
        <span class="up-arrow">›</span>
      </button>`;
  }).join('');

  /* ---- 푸터 ---- */
  $('#footer').textContent = `${TRIP.couple} · ${TRIP.start.slice(0,4)}`;
  if(DATA_SOURCE && DATA_SOURCE !== 'network'){
    const note = document.createElement('div');
    note.className = 'offline-note';
    note.textContent = DATA_SOURCE === 'cache' ? '오프라인 · 저장된 일정' : '백업 일정';
    $('#footer').appendChild(note);
  }
}

/* -----------------------------------------------------------
   긴급 연락처 — 그날 나라 것 + 어디서나 쓰는 것
   (cities[].flag 가 국가코드라 그대로 열쇠로 씁니다)

   tel: 은 네트워크가 없어도 걸리므로, 모든 게 무너져도 이 화면은 살아 있습니다.
   그래서 인라인 백업에도 넣어뒀습니다.
   ----------------------------------------------------------- */
const telHref = t => 'tel:' + String(t).replace(/[^\d+]/g, '');

function sosRow(l, hot){
  // 전화번호 형태가 아닌 값은 링크로 만들지 않습니다
  if(!/^[+\d][\d\s()+-]*$/.test(String(l.tel || ''))) return '';
  return `<a class="sos-row${hot ? ' hot' : ''}" href="${esc(telHref(l.tel))}"
      aria-label="${esc(l.label)} ${esc(l.tel)} 전화 걸기">
    ${TEL}
    <span class="sos-b">
      <span class="sos-l">${esc(l.label)}</span>
      ${l.note ? `<span class="sos-n">${esc(l.note)}</span>` : ''}
    </span>
    <span class="sos-t">${esc(l.tel)}</span>
  </a>`;
}

function renderSOS(city){
  const sec = $('#sec-sos');
  const pack = city && city.flag ? CONTACTS[city.flag] : null;
  if(!pack || !(pack.lines || []).length){ sec.hidden = true; return; }

  const common = (CONTACTS.common && CONTACTS.common.lines) || [];
  // 짧은 번호(112·144…) = 현지에서 바로 거는 것이라 강조합니다
  const html = pack.lines.map(l => sosRow(l, String(l.tel).length <= 4)).join('')
             + common.map(l => sosRow(l, false)).join('');

  sec.hidden = false;
  $('#head-sos').textContent = `긴급 연락처 · ${pack.name || city.flag}`;
  $('#sos').innerHTML = html;
  $('#sos-note').textContent = '탭하면 바로 걸립니다 · 데이터가 없어도 통화는 됩니다';
}

/* -----------------------------------------------------------
   오프라인 안내 — 일정은 캐시로 그대로 열리지만 구글맵은 못 엽니다.
   탭했다가 빈 탭만 뜨고 당황하지 않게 미리 알려줍니다.
   ----------------------------------------------------------- */
function paintNet(){
  const el = $('#netnote');
  el.hidden = navigator.onLine;
  if(!navigator.onLine){
    el.textContent = '오프라인 · 일정은 저장된 것으로 그대로 열립니다. '
      + '지도는 열리지 않으니, 장소 이름을 탭하면 검색어가 복사됩니다.';
  }
}
window.addEventListener('offline', paintNet);
window.addEventListener('online',  paintNet);

/* -----------------------------------------------------------
   한마디 — 그날 도시의 언어로 자주 쓸 문장
   (cities[].lang → phrases[lang]. 둘 중 하나라도 없으면 그냥 숨깁니다)
   ----------------------------------------------------------- */
function renderPhrases(city){
  const sec = $('#sec-phrases');
  const pack = city && city.lang ? PHRASES[city.lang] : null;
  const lines = (pack && pack.lines) || [];
  if(!lines.length){ sec.hidden = true; return; }

  sec.hidden = false;
  $('#head-phrases').textContent = `한마디 · ${pack.name || city.lang}`;
  $('#phrases').innerHTML = lines.map(l => `
    <button type="button" class="phr-row" data-copy="${esc(l.x)}"
            aria-label="${esc(l.ko)} — ${esc(l.x)} 복사">
      ${SPEAK}
      <span class="phr-b">
        <span class="phr-ko">${esc(l.ko)}</span>
        <span class="phr-x">${esc(l.x)}</span>
        ${l.r ? `<span class="phr-r">${esc(l.r)}</span>` : ''}
      </span>
    </button>`).join('');
  $('#phr-note').textContent = '탭하면 복사됩니다 · 그대로 보여주셔도 됩니다';
}

/* -----------------------------------------------------------
   D-day 카운트다운 (초 단위)
   ----------------------------------------------------------- */
function tickCountdown(){
  if(!countdownTarget) return;
  const diff = countdownTarget - new Date();
  if(diff <= 0){ render(); return; }
  const d = Math.floor(diff / 864e5);
  const h = Math.floor(diff % 864e5 / 36e5);
  const m = Math.floor(diff % 36e5 / 6e4);
  const s = Math.floor(diff % 6e4 / 1000);
  $('#now-title').textContent = d > 0
    ? `${d}일 ${pad(h)}:${pad(m)}:${pad(s)}`
    : `${pad(h)}:${pad(m)}:${pad(s)}`;
}

/* -----------------------------------------------------------
   이벤트 위임 — 예약번호 복사 / 이후 날 펼치기
   ----------------------------------------------------------- */
document.addEventListener('click', async (e) => {
  /* 오프라인이면 구글맵이 안 열립니다 — 빈 탭 대신 검색어를 복사해 줍니다.
     preventDefault 는 첫 await 전에 해야 먹히므로 맨 위에 둡니다. */
  const ml = e.target.closest('.map-link, .meet a');
  if(ml && !navigator.onLine){
    e.preventDefault();
    const q = decodeURIComponent(ml.getAttribute('href').split('query=')[1] || '');
    if(q && await copyText(q)) toast(`오프라인 · 복사됨 · ${q}`);
    else toast('오프라인 · 지도를 열 수 없습니다');
    return;
  }

  const ref = e.target.closest('.ref');
  if(ref && ref.dataset.copy){
    const val = ref.dataset.copy;
    const ok = await copyText(val);
    if(ok){
      ref.classList.add('copied');
      setTimeout(() => ref.classList.remove('copied'), 1400);
      // 가려진 값은 토스트에도 노출하지 않습니다
      toast(ref.querySelector('.masked') ? '복사됨' : `복사됨 · ${val}`);
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  const stay = e.target.closest('.chip.stay');
  if(stay && stay.dataset.copy){
    const ok = await copyText(stay.dataset.copy);
    if(ok){
      stay.classList.add('copied');
      setTimeout(() => stay.classList.remove('copied'), 1400);
      toast(`복사됨 · ${stay.dataset.copy}`);
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  const phr = e.target.closest('.phr-row');
  if(phr && phr.dataset.copy){
    const ok = await copyText(phr.dataset.copy);
    if(ok){
      phr.classList.add('copied');
      setTimeout(() => phr.classList.remove('copied'), 1400);
      toast('복사됨');
    }else{
      toast('복사에 실패했어요');
    }
    return;
  }

  const row = e.target.closest('.up-row');
  if(row){
    viewDate = row.dataset.date;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const node = e.target.closest('.j-node');
  if(node){
    const first = DAYS.find(d => d.city === node.dataset.city);
    if(first){
      viewDate = first.date;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }
});

/* -----------------------------------------------------------
   날짜 이동 — 버튼 / 스와이프 / 좌우 방향키
   ----------------------------------------------------------- */
/* 접기/펼치기 — 위쪽에 항목이 생겼다 사라지므로,
   보고 있던 "지금" 일정이 화면에서 튀지 않게 스크롤을 보정합니다 */
$('#past-fold').addEventListener('click', () => {
  const before = $('#tl li.live')?.getBoundingClientRect().top ?? null;
  showPast = !showPast;
  render();
  const after = $('#tl li.live')?.getBoundingClientRect().top ?? null;
  if(before !== null && after !== null) window.scrollBy(0, after - before);
});

$('#day-prev').addEventListener('click', () => stepDay(-1));
$('#day-next').addEventListener('click', () => stepDay(1));
$('#today-pill').addEventListener('click', goToday);

document.addEventListener('keydown', (e) => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'ArrowLeft')  stepDay(-1);
  if(e.key === 'ArrowRight') stepDay(1);
});

let tx = 0, ty = 0, tracking = false;
document.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tracking = true;
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if(!tracking) return;
  tracking = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  // 세로 스크롤과 헷갈리지 않게 가로가 확실히 클 때만
  if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
  stepDay(dx < 0 ? 1 : -1);
}, { passive: true });

/* -----------------------------------------------------------
   오늘로 이동 (플로팅 버튼)
   ----------------------------------------------------------- */
const fab = $('#to-today');

function updateFab(){
  if(!DAYS.length){ fab.classList.remove('show'); return; }
  // 다른 날을 보고 있으면 항상 노출, 오늘이면 카드가 화면 밖일 때만
  if(viewDate){ fab.classList.add('show'); return; }
  const card = $('#finale').hidden ? $('#now-card') : $('#finale');
  const r = card.getBoundingClientRect();
  const offscreen = r.bottom < 0 || r.top > window.innerHeight;
  fab.classList.toggle('show', offscreen);
}

fab.addEventListener('click', () => {
  if(viewDate){
    goToday();
  }else{
    const card = $('#finale').hidden ? $('#now-card') : $('#finale');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

let fabTick = false;
window.addEventListener('scroll', () => {
  if(fabTick) return;
  fabTick = true;
  requestAnimationFrame(() => { updateFab(); fabTick = false; });
}, { passive: true });

/* -----------------------------------------------------------
   부팅
   ----------------------------------------------------------- */
let booting = false;

function showError(err){
  $('#errbox').hidden = false;
  $('#src-note').hidden = true;
  $('#now-card').hidden = true;
  $('#sec-today').hidden = true;
  $('#sec-upcoming').hidden = true;
  $('#finale').hidden = true;
  $('#strip').innerHTML = '';
  $('#ey-date').textContent = '불러오기 실패';
  $('#err-msg').textContent = navigator.onLine
    ? '네트워크는 연결되어 있지만 일정 파일을 읽지 못했습니다.'
    : '오프라인 상태입니다. 연결되면 자동으로 최신 일정을 받아옵니다.';
  $('#err-why').textContent = err ? `원인: ${err}` : '';
}

async function boot(){
  if(booting) return;
  booting = true;
  $('#err-retry').disabled = true;
  $('#err-retry').textContent = '불러오는 중…';

  let res;
  try{
    res = await loadData();
  }catch(e){
    res = { data: null, source: null, error: e.message || String(e) };
  }

  $('#err-retry').disabled = false;
  $('#err-retry').textContent = '다시 시도';
  booting = false;

  const { data, source, error } = res;

  if(!data){
    // 이미 보여주던 일정이 있으면 화면을 지우지 않습니다.
    // 여행 중에 정보를 빼앗기는 게 최악이라, 알림만 띄우고 그대로 둡니다.
    if(DAYS.length){
      $('#src-note').hidden = false;
      $('#src-text').textContent = `최신 일정을 받지 못했습니다 (${error}). 이전 데이터를 보고 있습니다.`;
    }else{
      showError(error);
    }
    return;
  }

  try{
    TRIP   = data.trip;
    CITIES = data.cities;
    DAYS   = data.days.slice().sort((a,b) => a.date < b.date ? -1 : 1);
    PHRASES  = data.phrases  || {};
    CONTACTS = data.contacts || {};
    TOTAL_DAYS = daysBetween(TRIP.start, TRIP.end) + 1;
    DATA_SOURCE = source;

    $('#errbox').hidden = true;
    render();
  }catch(e){
    // 데이터는 왔는데 그리다 죽는 경우 — 빈 화면 대신 원인을 보여줍니다
    showError(`화면을 그리지 못했습니다 (${e.message})`);
    return;
  }

  // 네트워크가 아닌 출처면 알려주고 다시 받을 기회를 줍니다
  $('#src-note').hidden = source === 'network';
  if(source !== 'network'){
    $('#src-text').textContent = source === 'cache'
      ? '저장해 둔 일정을 보고 있습니다.'
      : '앱에 내장된 백업 일정입니다. 최신이 아닐 수 있습니다.';
  }
  updateFab();
}

$('#err-retry').addEventListener('click', boot);
$('#src-retry').addEventListener('click', boot);
$('#err-reload').addEventListener('click', () => location.reload());
$('#fin-review').addEventListener('click', () => {
  viewDate = DAYS[0].date;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

boot();

/* 1분마다 갱신 — 자정을 넘기면 날짜가 바뀌므로 보던 날도 오늘로 되돌립니다 */
let lastToday = today();
function tick(){
  if(!DAYS.length) return;
  if(today() !== lastToday){ lastToday = today(); viewDate = null; }
  render();
  updateFab();
}
setInterval(tick, 60000);
setInterval(() => { if(countdownTarget) tickCountdown(); }, 1000);

// 백그라운드에 오래 있다 돌아오면 1분을 기다리지 않고 바로 맞춥니다
document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });

// 다시 온라인이 되면 조용히 최신 일정으로 교체
window.addEventListener('online', () => { if(DATA_SOURCE !== 'network') boot(); });

/* -----------------------------------------------------------
   서비스 워커
   ----------------------------------------------------------- */
if('serviceWorker' in navigator){
  // 첫 설치 때의 claim 으로는 새로고침하지 않음 (최초 방문 리로드 방지)
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;

  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('service-worker.js', { updateViaCache: 'none' })
      .catch(() => {});
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
}
</script>
</body>
</html>
